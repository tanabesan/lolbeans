<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

/* ── TOKENS (コース一覧と統一) ── */
:root{
  --bg:#0d0e17;--bg2:#12141f;--panel:#171a29;--card:#12141f;
  --edge:#2c3044;--line:#2c3044;--line2:#3a3f5c;
  --t0:#d8dce8;--t1:#a8adc4;--t2:#6b7189;--t3:#3f4460;
  --acc:#00ffff;--acc2:#ff00ff;--acc3:#00ffff;--acc4:#ffe066;
  --glow-g:0 0 8px #00ffff,0 0 20px rgba(0,255,255,.4);
  --glow-b:0 0 8px #00ffff,0 0 20px rgba(0,255,255,.4);
  --glow-r:0 0 8px #ff00ff,0 0 20px rgba(255,0,255,.4);
  --ff:'JetBrains Mono',monospace;
  --ffj:'M PLUS Rounded 1c',sans-serif;
  --ffh:'Press Start 2P',cursive;
}

body{font-family:var(--ff);background:var(--bg);color:var(--t0);min-height:100vh;overflow-x:hidden}
body.jp{font-family:var(--ffj)}

/* ── CRT SCANLINES ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
}

/* ── BG ── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
  background-image:linear-gradient(rgba(0,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,.15) 1px,transparent 1px);
  background-size:32px 32px}
.bg-corner-tl,.bg-corner-tr,.bg-corner-bl,.bg-corner-br{position:fixed;width:120px;height:120px;pointer-events:none;z-index:0;opacity:.4}
.bg-corner-tl{top:0;left:0;border-top:2px solid var(--acc3);border-left:2px solid var(--acc3)}
.bg-corner-tr{top:0;right:0;border-top:2px solid var(--acc3);border-right:2px solid var(--acc3)}
.bg-corner-bl{bottom:0;left:0;border-bottom:2px solid var(--acc3);border-left:2px solid var(--acc3)}
.bg-corner-br{bottom:0;right:0;border-bottom:2px solid var(--acc3);border-right:2px solid var(--acc3)}

/* ── RANKED BG FX (回転エンブレム + 光の筋) ── */
.bg-emblem{
  position:fixed;top:-12vmin;left:50%;width:76vmin;height:76vmin;z-index:0;pointer-events:none;
  transform:translateX(-50%);opacity:.16;
  background:conic-gradient(from 0deg,
    transparent 0deg,rgba(0,255,255,.9) 6deg,transparent 14deg,
    transparent 86deg,rgba(255,0,255,.7) 94deg,transparent 102deg,
    transparent 176deg,rgba(0,255,255,.9) 184deg,transparent 192deg,
    transparent 266deg,rgba(255,0,255,.7) 274deg,transparent 282deg,
    transparent 360deg);
  border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 54%,#000 56%,#000 63%,transparent 65%);
  mask:radial-gradient(circle,transparent 54%,#000 56%,#000 63%,transparent 65%);
  animation:emblemSpin 46s linear infinite;
}
.bg-emblem::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 36%,transparent 38%);
  mask:radial-gradient(circle,transparent 30%,#000 32%,#000 36%,transparent 38%);
  background:conic-gradient(from 45deg,transparent 0deg,rgba(255,224,102,.6) 10deg,transparent 24deg,transparent 180deg,rgba(255,224,102,.6) 190deg,transparent 204deg,transparent 360deg);
  animation:emblemSpin 30s linear infinite reverse;
}
@keyframes emblemSpin{to{transform:rotate(360deg)}}
.bg-rays{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-rays i{
  position:absolute;top:-60%;width:16vw;height:220%;
  background:linear-gradient(180deg,transparent,rgba(0,255,255,.07) 45%,rgba(0,255,255,.07) 55%,transparent);
  transform:rotate(18deg);animation:raySweep linear infinite;
}
.bg-rays i:nth-child(2){background:linear-gradient(180deg,transparent,rgba(255,0,255,.06) 45%,rgba(255,0,255,.06) 55%,transparent);animation-duration:17s;animation-delay:-5s}
.bg-rays i:nth-child(3){background:linear-gradient(180deg,transparent,rgba(255,224,102,.05) 45%,rgba(255,224,102,.05) 55%,transparent);animation-duration:21s;animation-delay:-11s}
.bg-rays i:nth-child(1){animation-duration:14s}
@keyframes raySweep{0%{left:-20vw}100%{left:120vw}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── HEADER ── */
header{position:relative;z-index:10;text-align:center;padding:52px 16px 32px}
.logo-line{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.logo-text{
  font-family:var(--ffh);font-size:clamp(.9rem,3.5vw,1.6rem);
  color:var(--acc3);text-shadow:var(--glow-b);letter-spacing:.06em;
}
.logo-sub{
  font-family:var(--ffh);font-size:clamp(.5rem,2vw,.75rem);
  color:var(--acc);letter-spacing:.12em;text-shadow:var(--glow-g);
  margin-top:6px;
}
.logo-sub::after{content:'_';animation:blink .8s step-end infinite}
.logo-deco{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.logo-deco-line{width:80px;height:2px;background:var(--acc3);box-shadow:var(--glow-b);
  clip-path:polygon(0 0,100% 0,100% 50%,calc(100% - 4px) 50%,calc(100% - 4px) 100%,4px 100%,4px 50%,0 50%)}
.logo-deco span{color:var(--acc3);font-family:var(--ffh);font-size:.5rem}
.logo-deco-dot{width:7px;height:7px;background:var(--acc3);box-shadow:var(--glow-b);transform:rotate(45deg);flex-shrink:0}

/* ── STATS ── */
.stats-bar{position:relative;z-index:10;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:.4rem 1rem 1.8rem}
.s-pill{
  background:var(--panel);border:2px solid var(--line2);
  box-shadow:2px 2px 0 var(--edge);
  padding:7px 14px;font-size:.7rem;font-weight:700;color:var(--t2);
  display:flex;align-items:center;gap:8px;font-family:var(--ff);
}
.s-pill .v{color:var(--acc);font-family:var(--ffh);font-size:.65rem;text-shadow:var(--glow-g)}
.s-pill .ms{font-size:1rem;color:var(--acc3)}

/* ── EVENT BANNER (WRチャレンジ発生中) ── */
.event-banner-card{
  position:relative;z-index:10;display:flex;flex-direction:column;gap:9px;
  width:calc(100% - 2rem);max-width:420px;margin:0 auto .9rem;
  background:linear-gradient(160deg,#3a2d00,#241c00);border:2px solid var(--acc4);
  box-shadow:2px 2px 0 var(--edge),0 0 16px -2px var(--acc4);
  padding:11px 16px 13px;cursor:pointer;transition:transform .15s;
  animation:eventPulse 1.6s ease-in-out infinite;
}
.event-banner-card:hover{transform:translateY(-2px);background:linear-gradient(160deg,#4a3600,#2e2400)}
.event-banner-card-head{
  display:flex;align-items:center;gap:8px;color:var(--acc4);
  font-family:var(--ffh);font-size:.58rem;font-weight:800;letter-spacing:.04em;
}
.event-banner-icon{animation:eventBolt .9s ease-in-out infinite}
@keyframes eventPulse{
  0%,100%{box-shadow:2px 2px 0 var(--edge),0 0 10px -2px var(--acc4)}
  50%{box-shadow:2px 2px 0 var(--edge),0 0 26px 2px var(--acc4)}
}
@keyframes eventBolt{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-8deg) scale(1.15)}}

/* ── MONTHLY MVP ── */
.mvp-card{
  position:relative;z-index:10;display:none;flex-direction:column;gap:9px;
  width:calc(100% - 2rem);max-width:420px;margin:0 auto .9rem;
  background:linear-gradient(160deg,#002830,#001a20);border:2px solid var(--acc3);
  box-shadow:2px 2px 0 var(--edge),0 0 16px -2px var(--acc3);
  padding:11px 16px 13px;
}
.mvp-card-head{
  display:flex;align-items:center;gap:8px;color:var(--acc3);
  font-family:var(--ffh);font-size:.58rem;font-weight:800;letter-spacing:.04em;
}
.mvp-card-body{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mvp-card-name{font-family:var(--ffh);font-size:.85rem;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvp-card-pts{font-family:var(--ffh);font-size:.85rem;color:var(--acc3);text-shadow:0 0 10px rgba(50,220,240,.5);flex-shrink:0}

.event-banner-card-body{display:flex;align-items:center;gap:12px}
.event-banner-preview-thumb{
  width:54px;height:54px;flex-shrink:0;background-size:cover;background-position:center;
  background-color:var(--bg2);border:2px solid var(--acc4);position:relative;overflow:hidden;
}
.event-banner-preview-thumb::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 3px);
}
.event-banner-preview-info{flex:1;min-width:0}
.event-banner-preview-label{font-size:.48rem;color:var(--t3);font-weight:700;letter-spacing:.05em}
.event-banner-preview-name{
  font-family:var(--ffh);font-size:.58rem;color:var(--acc4);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.event-rule{max-width:640px;margin:0 auto 1.6rem;text-align:center;font-size:.72rem;line-height:1.7;color:var(--t2)}
.event-card-list{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.event-card{
  background:linear-gradient(160deg,var(--panel),var(--bg2));border:2px solid var(--acc4);
  padding:16px 18px;box-shadow:3px 3px 0 var(--edge);
}
.event-card-thumb{
  width:100%;height:120px;background-size:cover;background-position:center;
  background-color:var(--bg2);border:2px solid var(--acc4);position:relative;overflow:hidden;margin-bottom:12px;
}
.event-card-thumb::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);
}
.event-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.event-card-name{font-family:var(--ffh);font-size:.6rem;color:var(--acc4);line-height:1.5}
.event-card-badge{
  flex-shrink:0;font-family:var(--ffh);font-size:.44rem;font-weight:800;padding:4px 8px;
  background:var(--acc4);color:#241a00;white-space:nowrap;
}
.event-card-badge.updated{background:var(--acc3);box-shadow:0 0 10px -2px var(--acc3)}
.event-card-row{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:var(--t1);padding:5px 0;border-top:1px solid var(--line2)}
.event-card-row .lbl{color:var(--t3);font-weight:700}
.event-card-row .val{font-weight:800}
.event-card-countdown{font-family:var(--ffh);color:var(--acc4);font-size:.55rem}

/* ── INFO TOGGLE BUTTON ── */
.info-toggle-wrap{position:relative;z-index:10;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 1rem 1.2rem}
.info-toggle-btn{
  background:var(--panel);border:2px solid var(--acc3);box-shadow:2px 2px 0 var(--edge),var(--glow-b);
  padding:9px 18px;color:var(--acc3);font-family:var(--ffh);font-size:.5rem;
  font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:8px;
}
.info-toggle-btn:hover{background:var(--acc3);color:#0b0715;box-shadow:3px 3px 0 var(--edge)}
.sound-toggle-btn{
  background:var(--panel);border:2px solid var(--line2);box-shadow:2px 2px 0 var(--edge);
  width:38px;height:38px;flex-shrink:0;color:var(--t2);cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;
}
.sound-toggle-btn:hover{border-color:var(--acc4);color:var(--acc4)}
.sound-toggle-btn.on{border-color:var(--acc3);color:var(--acc3);box-shadow:2px 2px 0 var(--edge),var(--glow-b)}
.pname-link{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.25);transition:all .2s}
.pname-link:hover{border-bottom-color:currentColor;opacity:.85}

/* ── CONTROLS ── */
.controls{position:relative;z-index:10;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:0 1rem 1.8rem}
.sbox{position:relative}
.sbox input{
  background:var(--bg);border:2px solid var(--line2);
  padding:8px 12px 8px 36px;color:var(--t0);font-family:var(--ff);
  font-size:.82rem;font-weight:700;width:200px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.sbox input:focus{border-color:var(--acc3);box-shadow:var(--glow-b)}
.sbox input::placeholder{color:var(--t3)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:.85rem;pointer-events:none}
.cbtn{
  background:var(--panel);border:2px solid var(--line2);box-shadow:2px 2px 0 var(--edge);
  padding:8px 14px;color:var(--t2);font-family:var(--ffh);font-size:.45rem;
  font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.04em;
}
.cbtn:hover,.cbtn.on{border-color:var(--acc4);color:var(--acc4);box-shadow:2px 2px 0 rgba(255,224,102,.4),0 0 8px rgba(255,224,102,.2)}
.rbtn{
  background:var(--acc2);border:2px solid var(--acc2);
  padding:8px 16px;color:#0b0715;font-family:var(--ffh);font-size:.45rem;
  font-weight:900;cursor:pointer;box-shadow:4px 4px 0 rgba(255,0,255,.5);
  transition:all .15s;letter-spacing:.04em;
}
.rbtn:hover{background:transparent;color:var(--acc2);box-shadow:var(--glow-r),4px 4px 0 var(--acc2)}
.rbtn.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── INFO OVERLAY (ランク一覧 / ポイント計算・全画面) ── */
.info-overlay{
  position:fixed;inset:0;z-index:700;background:rgba(5,4,10,.96);
  display:flex;justify-content:center;align-items:flex-start;
  padding:2.4rem 1rem;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.info-overlay.open{opacity:1;pointer-events:all}
.info-panel{position:relative;width:100%;max-width:1400px;margin:0 auto}
.info-close{
  position:absolute;top:-6px;right:0;background:var(--panel);border:2px solid var(--line2);
  color:var(--t1);width:34px;height:34px;font-size:1rem;cursor:pointer;
  box-shadow:2px 2px 0 var(--edge);
}
.info-close:hover{border-color:var(--acc2);color:var(--acc2)}
.info-heading{
  font-family:var(--ffh);font-size:.65rem;letter-spacing:.1em;
  color:var(--acc3);text-align:center;text-transform:uppercase;
  text-shadow:var(--glow-b);margin-bottom:1.2rem;
}
.info-rank-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:stretch;gap:14px}
.info-rank-card{
  width:auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:2px solid var(--line2);padding:20px 12px 16px;text-align:center;
  box-shadow:3px 3px 0 var(--edge);transition:transform .15s,box-shadow .15s;
}
.info-rank-card:hover{transform:translate(-1px,-3px);box-shadow:4px 5px 0 var(--edge)}
.info-rank-shield{height:76px;width:auto;object-fit:contain;margin-bottom:12px}
.info-rank-name{display:block;font-family:var(--ffh);font-size:.56rem;font-weight:800;margin-bottom:4px}
.info-rank-pts{display:block;font-size:.62rem;opacity:.6;font-weight:700;margin-bottom:16px}
.info-rank-subs{flex:1;display:flex;flex-direction:column;gap:6px}
.info-rank-sub{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;
  background:var(--edge);border:1px solid var(--line2);padding:6px 4px;
}
.info-rank-sub-label{font-family:var(--ffh);font-size:.46rem;font-weight:800}
.info-rank-sub-range{font-size:.56rem;opacity:.6;font-weight:700}
.info-pt-table{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-pt-row{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line2);padding:8px 14px;font-size:.72rem;font-weight:700;color:var(--t1);
}
.info-pt-dot{width:9px;height:9px;flex-shrink:0}
.info-pt-pts{font-family:var(--ffh);color:var(--acc);margin-left:auto;font-size:.55rem}

/* ── TABLE ── */
.tw{position:relative;z-index:10;max-width:980px;margin:0 auto;padding:0 1rem 5rem}
.slbl{
  font-family:var(--ffh);font-size:.48rem;letter-spacing:.1em;
  color:var(--acc3);text-transform:uppercase;text-align:center;
  margin-bottom:14px;text-shadow:var(--glow-b);
}
.rt{width:100%;border-collapse:separate;border-spacing:0 6px}
.rt thead th{
  font-family:var(--ffh);font-size:.45rem;letter-spacing:.1em;
  color:var(--t2);text-transform:uppercase;padding:6px 10px;text-align:left;
}
.rt thead th.c{text-align:center}

/* ROW */
.rrow{
  background:var(--card);border:2px solid var(--line2);
  box-shadow:3px 3px 0 var(--edge);
  transition:transform .15s,box-shadow .15s,border-color .15s;
  animation:rIn .3s ease-out both;cursor:pointer;
}
@keyframes rIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.rrow:hover{transform:translate(-2px,-3px);border-color:var(--acc3);box-shadow:5px 5px 0 var(--acc3),var(--glow-b)}
.rrow td{padding:10px 10px;vertical-align:middle}
.rrow td:first-child{text-align:center;width:48px}
.top1{border-left:4px solid #ffd700;box-shadow:3px 3px 0 rgba(255,215,0,.4)}
.top2{border-left:4px solid #c8c8d4;box-shadow:3px 3px 0 rgba(200,200,212,.3)}
.top3{border-left:4px solid #e8874a;box-shadow:3px 3px 0 rgba(232,135,74,.35)}
.top1:hover{border-color:#ffd700;box-shadow:5px 5px 0 #ffd700,0 0 14px rgba(255,215,0,.4)}
.top2:hover{border-color:#c8c8d4;box-shadow:5px 5px 0 #c8c8d4}
.top3:hover{border-color:#e8874a;box-shadow:5px 5px 0 #e8874a}

.rnum{font-family:var(--ffh);font-size:.75rem;color:var(--t3);display:inline-block;min-width:28px;text-align:center}
.top1 .rnum{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6)}
.top2 .rnum{color:#c8c8d4}
.top3 .rnum{color:#e8874a}

.pcell{display:flex;align-items:center;gap:10px}
.shw{width:44px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.shi{width:auto;height:52px;object-fit:contain;transition:transform .2s,filter .2s;filter:drop-shadow(0 3px 7px var(--sg,rgba(0,0,0,.5)))}
.rrow:hover .shi{transform:scale(1.15) rotate(-4deg);filter:drop-shadow(0 4px 12px var(--sg,rgba(0,0,0,.5))) brightness(1.1)}
.pname{font-family:var(--ffh);font-size:.6rem;line-height:1.4;display:flex;align-items:center;gap:4px;flex-wrap:wrap}

<script>
const GAS='https://script.google.com/macros/s/AKfycbzxTXBtpZGmHR9Tp4-sspOUNQCAIN9Ur73XkVhwT1o3U2jDEhQ_VfZ12Be55YSedkuMqw/exec';
const THUMB_URL='https://lolbeans.io/ui/level-thumbnails/';
const PG=30;
let all=[],fil=[],sort='pts',pg=1,lang='jp',dataLoaded=false;
let ecoMode=localStorage.getItem('ecoMode')==='1';

/* ── 省エネ ── */
function applyEco(on){
  ecoMode=on;localStorage.setItem('ecoMode',on?'1':'0');
  document.body.classList.toggle('eco',on);
  const fl=document.getElementById('gfont-link');if(fl)fl.disabled=on;
}
if(ecoMode)applyEco(true);

/* ── SOUND (8bit風SE, Web Audio APIで自前生成) ── */
let soundOn=localStorage.getItem('soundOn')!=='0';
let actx=null;
function ensureAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){soundOn=false;}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function beep(freq,dur,type,vol,slideTo){
  if(!soundOn||!actx)return;
  const t0=actx.currentTime;
  const osc=actx.createOscillator();const gain=actx.createGain();
  osc.type=type||'square';
  osc.frequency.setValueAtTime(freq,t0);
  if(slideTo)osc.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  gain.gain.setValueAtTime(vol||.05,t0);
  gain.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);osc.stop(t0+dur+.02);
}
function sfx(name){
  if(!soundOn)return;
  ensureAudio();if(!actx)return;
  switch(name){
    case'click':beep(560,.05,'square',.04);break;
    case'toggle':beep(700,.06,'square',.045);break;
    case'nav':beep(420,.04,'square',.03);break;
    case'open':beep(320,.09,'square',.05,760);break;
    case'close':beep(680,.08,'square',.045,300);break;
    case'refresh':beep(440,.05,'square',.04);setTimeout(()=>beep(680,.06,'square',.04),70);break;
    case'page':beep(500,.04,'square',.035);break;
  }
}
function toggleSound(){
  soundOn=!soundOn;localStorage.setItem('soundOn',soundOn?'1':'0');
  document.getElementById('soundBtn').classList.toggle('on',soundOn);
  document.getElementById('soundIcon').textContent=soundOn?'volume_up':'volume_off';
  if(soundOn){ensureAudio();beep(600,.06,'square',.05);}
}
(function(){
  const b=document.getElementById('soundBtn'),ic=document.getElementById('soundIcon');
  if(b&&ic){b.classList.toggle('on',soundOn);ic.textContent=soundOn?'volume_up':'volume_off';}
})();

/* ── i18n ── */
function setLang(l){
  if(l!==lang)sfx('toggle');
  lang=l;
  document.body.classList.toggle('jp',l==='jp');
  document.getElementById('hSub').textContent=l==='jp'?'コミュニティチャンピオンボード':'Community Champion Board';
  document.querySelectorAll('.i18n').forEach(el=>{const v=el.dataset[l];if(v)el.textContent=v});
  document.getElementById('si').placeholder=l==='jp'?'プレイヤーを検索…':'Search player…';
  if(document.getElementById('infoOverlay').classList.contains('open'))buildInfoOverlay();
  if(activeEvents.length>0)document.getElementById('eventBannerText').textContent=
    lang==='jp'
      ?(activeEvents.length>1?`イベント発生中！（${activeEvents.length}件）`:'イベント発生中！')
      :(activeEvents.length>1?`Event Active! (${activeEvents.length})`:'Event Active!');
  if(document.getElementById('eventOverlay').classList.contains('open'))renderEventCards();
  if(activeEvents.length>0)renderEventPreview();
  if(dataLoaded)renderMonthlyMvp();
  renderTable();
}

/* ── RANKS ── */
const RANKS=[
  {id:'gm',jp:'グランドマスター',en:'Grand Master',minPts:150,maxPts:Infinity,col:'#ff2d55',bg:'#1a000a',b1:'#ff2d55',b2:'#ff8c00',b3:'#ffd700',glow:'rgba(255,45,85,.8)',icon:'crown',subs:[{jp:'I',en:'I',min:150},{jp:'II',en:'II',min:200},{jp:'III',en:'III',min:250}]},
  {id:'mst',jp:'マスター',en:'Master',minPts:75,maxPts:149,col:'#d946ef',bg:'#150020',b1:'#7c3aed',b2:'#c026d3',b3:'#e879f9',glow:'rgba(192,38,211,.75)',icon:'gem',subs:[{jp:'I',en:'I',min:75},{jp:'II',en:'II',min:95},{jp:'III',en:'III',min:120}]},
  {id:'dia',jp:'ダイヤモンド',en:'Diamond',minPts:30,maxPts:74,col:'#22d3ee',bg:'#001520',b1:'#0891b2',b2:'#06b6d4',b3:'#67e8f9',glow:'rgba(6,182,212,.7)',icon:'diamond',subs:[{jp:'I',en:'I',min:30},{jp:'II',en:'II',min:42},{jp:'III',en:'III',min:55}]},
  {id:'plat',jp:'プラチナ',en:'Platinum',minPts:10,maxPts:29,col:'#34d399',bg:'#001a10',b1:'#059669',b2:'#10b981',b3:'#6ee7b7',glow:'rgba(16,185,129,.65)',icon:'star6',subs:[{jp:'I',en:'I',min:10},{jp:'II',en:'II',min:16},{jp:'III',en:'III',min:22}]},
  {id:'gold',jp:'ゴールド',en:'Gold',minPts:5,maxPts:9,col:'#fbbf24',bg:'#1a0e00',b1:'#b45309',b2:'#d97706',b3:'#fde68a',glow:'rgba(251,191,36,.7)',icon:'star5',subs:[{jp:'I',en:'I',min:5},{jp:'II',en:'II',min:6},{jp:'III',en:'III',min:8}]},
  {id:'sil',jp:'シルバー',en:'Silver',minPts:2,maxPts:4,col:'#94a3b8',bg:'#0e1018',b1:'#475569',b2:'#64748b',b3:'#cbd5e1',glow:'rgba(100,116,139,.6)',icon:'shield',subs:[{jp:'I',en:'I',min:2},{jp:'II',en:'II',min:3},{jp:'III',en:'III',min:4}]},
  {id:'brz',jp:'ブロンズ',en:'Bronze',minPts:0,maxPts:1,col:'#fb923c',bg:'#1a0800',b1:'#9a3412',b2:'#ea580c',b3:'#fed7aa',glow:'rgba(234,88,12,.6)',icon:'bean',subs:[{jp:'I',en:'I',min:0},{jp:'II',en:'II',min:1},{jp:'III',en:'III',min:1}]},
];
const getRank=p=>RANKS.find(r=>p>=r.minPts)||RANKS[6];
function getSubTier(rk,pts){let r=0;for(let i=0;i<rk.subs.length;i++){if(pts>=rk.subs[i].min)r=i;}return r;}

/* ── SHIELD IMAGE (自作画像に差し替え) ── */
const RANK_IMG_BASE='https://tanabesan.github.io/lolbeans/community/file/';
function mkShield(r,sz=44,subIdx=null){
  // ブロンズだけ階級なしの共通1枚、他は I/II/III (1/2/3) の3枚
  if(r.id==='brz')return RANK_IMG_BASE+'rank_brz.png';
  const si=subIdx===null?2:subIdx;
  return RANK_IMG_BASE+`rank_${r.id}_${si+1}.png`;
}

/* ── INFO OVERLAY (ランク一覧 / ポイント計算) ── */
const PT_ROWS=[
  {col:'#ff5070',en:'avg 1000+',jp:'平均 1000+',pt:15},
  {col:'#ffc832',en:'avg 750+',jp:'平均 750+',pt:10},
  {col:'#32dce8',en:'avg 500+',jp:'平均 500+',pt:5},
  {col:'#a564ff',en:'avg 100+',jp:'平均 100+',pt:2},
  {col:'#3ce68c',en:'under 100',jp:'100未満',pt:1},
  {col:'#ffb800',en:'WR Challenge win',jp:'WRチャレンジ成功',pt:15},
];
function buildInfoOverlay(){
  document.getElementById('infoRankRow').innerHTML=[...RANKS].reverse().map(r=>{
    const url=mkShield(r,64,2);
    const next=RANKS[RANKS.indexOf(r)-1];
    const lbl=next?`${r.minPts}–${next.minPts-1} pt`:`${r.minPts}+ pt`;
    const name=lang==='jp'?r.jp:r.en;
    const subRows=r.id==='brz'?'':r.subs.map((s,i)=>{
      const subLbl=s[lang];
      const rangeEnd=i<r.subs.length-1?r.subs[i+1].min-1:null;
      const range=rangeEnd!==null?`${s.min}–${rangeEnd}pt`:(next?`${s.min}–${next.minPts-1}pt`:`${s.min}pt+`);
      return`<div class="info-rank-sub" style="border-color:${r.col}30"><span class="info-rank-sub-label" style="color:${r.col}">${name} ${subLbl}</span><span class="info-rank-sub-range">${range}</span></div>`;
    }).join('');
    return`<div class="info-rank-card" style="border-color:${r.col}50"><img class="info-rank-shield" src="${url}" alt="${name}"><span class="info-rank-name" style="color:${r.col}">${name}</span><span class="info-rank-pts">${lbl}</span>${subRows?`<div class="info-rank-subs">${subRows}</div>`:''}</div>`;
  }).join('');
  document.getElementById('infoPtTable').innerHTML=PT_ROWS.map(p=>{
    const label=lang==='jp'?p.jp:p.en;
    return`<div class="info-pt-row"><div class="info-pt-dot" style="background:${p.col}"></div><span>${label}</span><span class="info-pt-pts">${p.pt}pt</span></div>`;
  }).join('');
}
function openInfoOverlay(){
  sfx('open');
  buildInfoOverlay();
  document.getElementById('infoOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeInfoOverlay(){
  const ov=document.getElementById('infoOverlay');
  if(ov.classList.contains('open'))sfx('close');
  ov.classList.remove('open');
  document.body.style.overflow='';
}
function closeInfoOverlayBg(e){
  if(e.target===document.getElementById('infoOverlay'))closeInfoOverlay();
}

/* ── EVENT BANNER (WR更新チャレンジ) ── */
let activeEvents=[];
let eventCountdownTimer=null;

async function checkActiveEvents(){
  try{
    const res=await fetch(`${GAS}?action=activeChallenge`);
    const data=await res.json();
    activeEvents=(data&&data.active&&Array.isArray(data.events))?data.events:[];
  }catch(e){
    console.error('イベント情報の取得に失敗しました',e);
    activeEvents=[];
  }
  const card=document.getElementById('eventBannerCard');
  if(activeEvents.length>0){
    document.getElementById('eventBannerText').textContent=
      lang==='jp'
        ?(activeEvents.length>1?`イベント発生中！（${activeEvents.length}件）`:'イベント発生中！')
        :(activeEvents.length>1?`Event Active! (${activeEvents.length})`:'Event Active!');
    card.style.display='flex';
    renderEventPreview();
  }else{
    card.style.display='none';
    document.getElementById('eventBannerCardBody').innerHTML='';
  }
}

function renderEventPreview(){
  const body=document.getElementById('eventBannerCardBody');
  if(!activeEvents.length){body.innerHTML='';return;}
  const ev=activeEvents[0];
  const th=`${THUMB_URL}${ev.levelId}.png`;
  body.innerHTML=`<div class="event-banner-preview-thumb" style="background-image:url('${th}')"></div>
    <div class="event-banner-preview-info">
      <div class="event-banner-preview-label">${lang==='jp'?'対象コース':'Target Course'}</div>
      <div class="event-banner-preview-name">${esc(ev.levelName||'')}</div>
    </div>`;
}

function formatCountdown(deadlineIso){
  const diff=new Date(deadlineIso).getTime()-Date.now();
  if(diff<=0)return lang==='jp'?'まもなく判定…':'Resolving soon…';
  const h=Math.floor(diff/3600000);
  const d=Math.floor(h/24);
  const rh=h%24;
  const m=Math.floor((diff%3600000)/60000);
  if(d>0)return lang==='jp'?`あと ${d}日 ${rh}時間`:`${d}d ${rh}h left`;
  if(rh>0)return lang==='jp'?`あと ${rh}時間 ${m}分`:`${rh}h ${m}m left`;
  return lang==='jp'?`あと ${m}分`:`${m}m left`;
}

function courseTypeLabel(type){
  const map={0:{jp:'サンドボックス',en:'Sandbox'},1:{jp:'タイムアタック',en:'Timed'},2:{jp:'コンペティティブ',en:'Competitive'},3:{jp:'エリミネーション',en:'Elimination'}};
  const t=map[type];
  return t?t[lang]:(lang==='jp'?'不明':'Unknown');
}

function renderEventCards(){
  document.getElementById('eventCardList').innerHTML=activeEvents.map(ev=>{
    const holderNow=ev.currentHolder||ev.holderAtStart||'—';
    const badge=ev.updatedAlready
      ?`<span class="event-card-badge updated">${lang==='jp'?'更新済み！':'Updated!'}</span>`
      :`<span class="event-card-badge">${lang==='jp'?'挑戦中':'In Progress'}</span>`;
    return`<div class="event-card">
      <div class="event-card-thumb" style="background-image:url('${THUMB_URL}${ev.levelId}.png')"></div>
      <div class="event-card-top">
        <div class="event-card-name">${esc(ev.levelName||'')}${ev.author?`<div style="font-size:.55rem;color:var(--t3);font-weight:700;margin-top:4px">by ${esc(ev.author)} ・ ${courseTypeLabel(ev.type)}</div>`:''}</div>
        ${badge}
      </div>
      <div class="event-card-row"><span class="lbl">${lang==='jp'?'開始時のWRホルダー':'Holder at Start'}</span><span class="val">${esc(ev.holderAtStart||'—')}</span></div>
      <div class="event-card-row"><span class="lbl">${lang==='jp'?'現在のWRホルダー':'Current Holder'}</span><span class="val" style="color:${ev.updatedAlready?'var(--acc3)':'var(--t1)'}">${esc(holderNow)}</span></div>
      <div class="event-card-row"><span class="lbl">${lang==='jp'?'判定まで':'Time Left'}</span><span class="val event-card-countdown">${formatCountdown(ev.deadline)}</span></div>
    </div>`;
  }).join('')||`<div style="text-align:center;color:var(--t3);font-size:.7rem;padding:2rem 0">${lang==='jp'?'現在進行中のイベントはありません':'No active events right now'}</div>`;
}

function openEventModal(){
  renderEventCards();
  document.getElementById('eventOverlay').classList.add('open');
  document.body.style.overflow='hidden';
  clearInterval(eventCountdownTimer);
  eventCountdownTimer=setInterval(renderEventCards,30000);
}
function closeEventOverlay(){
  const ov=document.getElementById('eventOverlay');
  if(ov.classList.contains('open'))sfx('close');
  ov.classList.remove('open');
  document.body.style.overflow='';
  clearInterval(eventCountdownTimer);
}
function closeEventOverlayBg(e){
  if(e.target===document.getElementById('eventOverlay'))closeEventOverlay();
}

/* ── DATA ── */
async function loadData(){
  const btn=document.getElementById('rBtn');btn.classList.add('spin');
  document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms" style="font-size:2.5rem;display:block;margin-bottom:1rem;color:var(--acc3)">progress_activity</span>${lang==='jp'?'読み込み中…':'Loading…'}</div>`;
  document.getElementById('pg').innerHTML='';
  try{
    const res=await fetch(GAS);if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const raw=await res.json();
    if(!Array.isArray(raw)||!raw.length)throw new Error(lang==='jp'?'データが空です':'Empty data');
    all=raw.map(r=>({name:String(r.name||''),under100:+r.under100||0,p100:+r.p100||0,p500:+r.p500||0,p750:+r.p750||0,p1000:+r.p1000||0,wrCount:+r.wrCount||0,totalPoints:+r.totalPoints||0,event:+r.event||0,peakPoints:+r.peakPoints||0,monthlyPoints:+r.monthlyPoints||0}));
    all.sort((a,b)=>b.totalPoints-a.totalPoints||b.wrCount-a.wrCount);
    all.forEach((d,i)=>d.globalRank=i+1);
    document.getElementById('sH').textContent=all.length.toLocaleString();
    document.getElementById('sL').textContent=all.reduce((s,d)=>s+d.wrCount,0).toLocaleString();
    document.getElementById('sT').textContent=new Date().toLocaleTimeString('ja-JP');
    dataLoaded=true;applyFil();renderMonthlyMvp();toast(lang==='jp'?'読み込み完了':'Loaded');
  }catch(e){
    document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms big" style="color:var(--acc2)">error</span>${lang==='jp'?'データの取得に失敗しました':'Failed to load'}<br><small style="color:#ff5070;font-size:.65rem;margin-top:.5rem;display:block">${e.message}</small></div>`;
    toast(lang==='jp'?'失敗':'Failed');
  }
  btn.classList.remove('spin');
}

function renderMonthlyMvp(){
  const card=document.getElementById('mvpCard');
  const top=all.filter(d=>d.monthlyPoints>0).sort((a,b)=>b.monthlyPoints-a.monthlyPoints)[0];
  document.getElementById('mvpCardLabel').textContent=lang==='jp'?'今月のMVP':"This Month's MVP";
  if(!top){card.style.display='none';return;}
  document.getElementById('mvpCardBody').innerHTML=`<div class="mvp-card-name">${esc(top.name)}</div><div class="mvp-card-pts">${top.monthlyPoints}pt</div>`;
  card.style.display='flex';
}

function setSort(m){sfx('toggle');sort=m;pg=1;document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('on'));document.getElementById(m==='pts'?'bPts':'bWr').classList.add('on');applyFil();}
function onSearch(){pg=1;applyFil();}
function applyFil(){
  const q=document.getElementById('si').value.trim().toLowerCase();
  fil=all.filter(d=>d.name.toLowerCase().includes(q));
  if(sort==='pts')fil.sort((a,b)=>b.totalPoints-a.totalPoints||b.wrCount-a.wrCount);
  else fil.sort((a,b)=>b.wrCount-a.wrCount||b.totalPoints-a.totalPoints);
  renderTable();renderPager();
}

/* ── RENDER TABLE ── */
function renderTable(){
  if(!dataLoaded)return;
  if(!fil.length){document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms" style="font-size:2.5rem;display:block;margin-bottom:1rem;color:var(--t2)">manage_search</span>${lang==='jp'?'見つかりませんでした':'No players found.'}</div>`;return;}
  const start=(pg-1)*PG;
  const rows=fil.slice(start,start+PG).map((d,li)=>{
    const gr=start+li+1;
    const tc=gr===1?'top1':gr===2?'top2':gr===3?'top3':'topN';
    const rk=getRank(d.totalPoints);const subIdx=getSubTier(rk,d.totalPoints);
    const url=mkShield(rk,44,subIdx);
    const filledPips=subIdx+1;let pips='';
    if(rk.id!=='brz'){for(let i=0;i<3;i++){const filled=i<filledPips;pips+=`<div class="stpip ${filled?'filled':'empty'}" style="background:${filled?rk.col:'var(--t3)'};${filled?`--pc:${rk.col}`:''}"></div>`;}}
    const chips=[d.event?`<span class="chip cev">イベント×${d.event}</span>`:'',d.p1000?`<span class="chip c1000">1000+×${d.p1000}</span>`:'',d.p750?`<span class="chip c750">750+×${d.p750}</span>`:'',d.p500?`<span class="chip c500">500+×${d.p500}</span>`:'',d.p100?`<span class="chip c100">100+×${d.p100}</span>`:'',d.under100?`<span class="chip cu100">&lt;100×${d.under100}</span>`:''].join('');
    const rkName=lang==='jp'?rk.jp:rk.en;const subName=rk.subs[subIdx][lang];
    const rankLabel=rk.id==='brz'?rkName:`${rkName} ${subName}`;
    const ptsStyle=gr>3?`color:${rk.col};text-shadow:0 0 10px ${rk.col}55`:gr===1?'color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.55)':gr===2?'color:#c8c8d4':'color:#e8874a';
    return`<tr class="rrow ${tc}" style="animation-delay:${li*.028}s" onclick="openModal(${d.globalRank-1})">
      <td><span class="rnum">${gr}</span></td>
      <td><div class="pcell"><div class="shw" style="--sg:${rk.glow}"><img class="shi" src="${url}" alt="${rkName}"></div>
        <div>
          <a class="pname pname-link" href="community.html?player=${encodeURIComponent(d.name)}" target="_blank" onclick="event.stopPropagation()" title="${lang==='jp'?'WRコース一覧を見る':'View WR courses'}">${esc(d.name)}</a>
          <span class="prank-lbl" style="color:${rk.col};background:${rk.col}18;border:1px solid ${rk.col}28">${rankLabel}</span>
          <div class="subtier">${pips}</div>
        </div></div></td>
      <td class="cc"><div class="cats">${chips||`<span style="color:var(--t3);font-size:.65rem">—</span>`}</div></td>
      <td><div class="wrc">${d.wrCount}</div></td>
      <td><div class="ptv" style="${ptsStyle}">${d.totalPoints}</div></td>
    </tr>`;
  }).join('');
  const thPl=lang==='jp'?'プレイヤー':'Player';
  const thCa=lang==='jp'?'カテゴリ':'WR Breakdown';
  const thWr=lang==='jp'?'WR数':'WRs';
  const thPt=lang==='jp'?'ポイント':'Points';
  document.getElementById('tc').innerHTML=`<table class="rt"><thead><tr><th class="c" style="width:48px">#</th><th>${thPl}</th><th class="c cc">${thCa}</th><th class="c">${thWr}</th><th class="c">${thPt}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── MODAL ── */
function openModal(idx){
  const d=all[idx];if(!d)return;
  sfx('open');
  currentModalName=d.name;
  const rk=getRank(d.totalPoints);const subIdx=getSubTier(rk,d.totalPoints);
  const rkName=lang==='jp'?rk.jp:rk.en;const subName=rk.subs[subIdx][lang];
  const rankLabel=rk.id==='brz'?rkName:`${rkName} ${subName}`;
  const url=mkShield(rk,64,subIdx);
  const pos=d.globalRank;const total=all.length;const pct=Math.round((1-(pos-1)/total)*100);
  const sameRank=all.filter(x=>getRank(x.totalPoints).id===rk.id);
  const posInRank=sameRank.findIndex(x=>x.name===d.name)+1;const totalInRank=sameRank.length;
  const nextRank=RANKS[RANKS.indexOf(rk)-1];const prevMin=rk.minPts;const nextMin=nextRank?nextRank.minPts:rk.minPts+50;
  const progressPct=nextRank?Math.min(100,Math.round(((d.totalPoints-prevMin)/(nextMin-prevMin))*100)):100;
  const stCards=rk.id==='brz'?'':rk.subs.map((s,i)=>{const isCurrent=i===subIdx;const hi=i<rk.subs.length-1?rk.subs[i+1].min-1:(nextRank?nextMin-1:999);const range=`${s.min}–${hi}pt`;return`<div class="stier-card${isCurrent?' current':''}" style="--pc:${rk.col}"><div class="stier-card-name" style="color:${isCurrent?rk.col:'var(--t2)'}">${lang==='jp'?rk.jp:rk.en} ${s[lang]}</div><div class="stier-card-range">${range}</div>${isCurrent?`<div class="stier-card-you">▶ ${esc(d.name)}</div>`:''}</div>`;}).join('');
  const peakRk=d.peakPoints>d.totalPoints?getRank(d.peakPoints):null;
  const peakSubIdx=peakRk?getSubTier(peakRk,d.peakPoints):0;
  const peakLabel=peakRk?(peakRk.id==='brz'?(lang==='jp'?peakRk.jp:peakRk.en):`${lang==='jp'?peakRk.jp:peakRk.en} ${peakRk.subs[peakSubIdx][lang]}`):'';
  const chips=[d.event?`<span class="chip cev">イベント: ${d.event}個</span>`:'',d.p1000?`<span class="chip c1000">1000+: ${d.p1000}個</span>`:'',d.p750?`<span class="chip c750">750+: ${d.p750}個</span>`:'',d.p500?`<span class="chip c500">500+: ${d.p500}個</span>`:'',d.p100?`<span class="chip c100">100+: ${d.p100}個</span>`:'',d.under100?`<span class="chip cu100">&lt;100: ${d.under100}個</span>`:''].join('');
  const t=lang==='jp';
  const seg3=nextRank?(()=>{const rangeTotal=nextMin-prevMin;const b1=rk.subs[1].min;const b2=rk.subs[2].min;const p1=Math.round((b1-prevMin)/rangeTotal*100);const p2=Math.round((b2-prevMin)/rangeTotal*100);return{p1,p2,b1,b2};})():null;
  const tipLeft=Math.min(98,Math.max(2,progressPct));
  const tipHtml=nextRank?`<div class="rp-tip" id="rpTip" style="left:${tipLeft}%;--tipcolor:${rk.col}">${d.totalPoints}pt</div>`:'';
  const divHtml=seg3?`<div class="rp-div" style="left:${seg3.p1}%"></div><div class="rp-div" style="left:${seg3.p2}%"></div>`:'';
  const segLblHtml=seg3?`<div class="rp-seg-labels"><div class="rp-seg-lbl" style="flex:${seg3.p1}">${lang==='jp'?rk.jp+' I':rk.en+' I'}<br>${prevMin}–${seg3.b1-1}pt</div><div class="rp-seg-lbl" style="flex:${seg3.p2-seg3.p1}">${lang==='jp'?rk.jp+' II':rk.en+' II'}<br>${seg3.b1}–${seg3.b2-1}pt</div><div class="rp-seg-lbl" style="flex:${100-seg3.p2}">${lang==='jp'?rk.jp+' III':rk.en+' III'}<br>${seg3.b2}–${nextMin-1}pt</div></div>`:'';

  // 次のグレード(階級)までの進捗 (ブロンズには階級が無いので次ランクまでの進捗に直行)
  const gradeCur=subIdx;const isBrz=rk.id==='brz';const hasNextGrade=isBrz?!!nextRank:(gradeCur<2||nextRank);
  let gradeMin,gradeNextMin,gradeProgressPct,gradeNextRankObj,gradeNextName;
  if(isBrz){
    if(nextRank){gradeMin=prevMin;gradeNextMin=nextMin;gradeProgressPct=progressPct;gradeNextRankObj=nextRank;gradeNextName=`${t?nextRank.jp:nextRank.en} ${nextRank.subs[0][lang]}`;}
  }else if(gradeCur<2){
    gradeMin=rk.subs[gradeCur].min;gradeNextMin=rk.subs[gradeCur+1].min;
    gradeProgressPct=Math.min(100,Math.round(((d.totalPoints-gradeMin)/(gradeNextMin-gradeMin))*100));
    gradeNextRankObj=rk;gradeNextName=`${t?rk.jp:rk.en} ${rk.subs[gradeCur+1][lang]}`;
  }else if(nextRank){
    gradeMin=rk.subs[2].min;gradeNextMin=nextMin;
    gradeProgressPct=progressPct;
    gradeNextRankObj=nextRank;gradeNextName=`${t?nextRank.jp:nextRank.en} ${nextRank.subs[0][lang]}`;
  }
  const gradeBarLabel=isBrz?(t?'次のランクまで':'Progress to Next Rank'):(t?'次のグレードまで':'Progress to Next Grade');
  const gradeBarHtml=hasNextGrade?`<div class="rank-pos-wrap"><div class="rp-label">${gradeBarLabel}</div><div class="rp-bar-bg"><div class="rp-bar-track"><div class="rp-bar-fill" style="width:${gradeProgressPct}%;background:linear-gradient(90deg,${rk.b1},${rk.b3})"></div></div></div><div class="rp-pct">${t?`${gradeNextName} まで あと ${gradeNextMin-d.totalPoints}pt`:`${gradeNextMin-d.totalPoints}pt to ${gradeNextName}`}</div></div>`:`<div class="rank-pos-wrap"><div class="rp-label">${gradeBarLabel}</div><div class="rp-pct">${isBrz?(t?'最高ランク到達！':'Max Rank Achieved!'):(t?'最高グレード到達！':'Max Grade Achieved!')}</div></div>`;
  document.getElementById('modalBox').style.setProperty('--pc',rk.col);
  document.getElementById('modalBox').style.setProperty('--pg',rk.glow);
  document.getElementById('modalBox').style.setProperty('--pb1',rk.bg);
  document.getElementById('modalBox').style.setProperty('--pb2',rk.b1);
  document.getElementById('modalContent').innerHTML=`
    <div class="mh-banner mh-banner-wide${rk.id==='gm'?' mh-banner-fire':rk.id==='mst'?' mh-banner-fire-mst':rk.id==='dia'?' mh-banner-fire-dia':rk.id==='plat'?' mh-banner-fire-plat':''}"><div class="mh-title-wide"><div class="mh-name">${esc(d.name)}</div><span class="mh-rank" style="background:#0b0715;border:1px solid ${rk.col};color:${rk.col};opacity:1">${rankLabel}</span>${peakRk?`<span class="mh-peak"><span class="ms">military_tech</span>${lang==='jp'?'歴代最高':'Peak'}: ${peakLabel} (${d.peakPoints}pt)</span>`:''}</div></div>
    <div class="modal-inner mw">
    <div class="mw-grid">
      <div class="mw-side">
        <img class="mw-shield-big" src="${url}" alt="${rkName}" style="filter:drop-shadow(0 6px 18px ${rk.glow})">
        <div class="mw-rankname" style="color:${rk.col}">${rkName}</div>
        ${rk.id!=='brz'?`<div class="mw-subname">${subName}</div>`:''}
        ${rk.id!=='brz'?`<div class="stier-wrap mw-stier"><div class="stier-title">${t?'ランク内の階級':'Rank Divisions'}</div><div class="stier-grid">${stCards}</div></div>`:''}
      </div>
      <div class="mw-main">
        <div class="mw-circles">
          <div class="mw-circle" style="--cc:${rk.col}"><div class="mw-circle-lbl">${t?'ポイント':'Points'}</div><div class="mw-circle-val">${d.totalPoints}</div></div>
          <div class="mw-circle" style="--cc:var(--acc3)"><div class="mw-circle-lbl">${t?'WR数':'WR Count'}</div><div class="mw-circle-val">${d.wrCount}</div></div>
        </div>
        <div class="rank-pos-wrap"><div class="rp-label">${t?'全体順位':'Overall Ranking'}</div><div class="rp-bar-bg"><div class="rp-bar-track"><div class="rp-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${rk.b1},${rk.b3})"></div></div></div><div class="rp-pct">${t?`全${total}人中 ${pos}位 (上位${100-pct}%)`:`#${pos} of ${total} players (Top ${100-pct}%)`}</div></div>
        ${gradeBarHtml}
        <div class="mstats mw-mstats"><div class="mstat"><div class="mstat-lbl">${t?'同ランク内順位':'In-Rank Position'}</div><div class="mstat-val">${posInRank} / ${totalInRank}</div></div><div class="mstat"><div class="mstat-lbl">${t?'全体パーセンタイル':'Percentile'}</div><div class="mstat-val">Top ${100-pct}%</div></div></div>
        ${chips?`<div class="mchips">${chips}</div>`:''}
      </div>
    </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect();}
function closeModalDirect(){
  const mo=document.getElementById('modalOverlay');
  if(mo.classList.contains('open'))sfx('close');
  mo.classList.remove('open');
  document.body.style.overflow='';
}

/* ── CARD DOWNLOAD ── */
let currentModalName='player';
function downloadModalCard(){
  sfx('click');
  const modal=document.getElementById('modalBox');
  const scroller=document.getElementById('modalScroll');
  const btn=document.getElementById('modalDlBtn');
  if(typeof html2canvas==='undefined'){alert(lang==='jp'?'画像生成ライブラリの読み込みに失敗しました':'Failed to load image library');return;}
  btn.classList.add('busy');
  modal.classList.add('capturing');
  const prevMaxH=modal.style.maxHeight,prevScrollMaxH=scroller.style.maxHeight,prevOverflow=scroller.style.overflow;
  modal.style.maxHeight='none';
  scroller.style.overflow='visible';
  scroller.style.maxHeight='none';
  // Material Symbols(可変フォント)がhtml2canvasの文字マッチングを狂わせ、
  // 数値テキストがアイコン化するバグがあるため、キャプチャ中だけ無効化する
  const msLink=document.getElementById('ms-font-link');
  const msWasEnabled=msLink&&!msLink.disabled;
  if(msLink)msLink.disabled=true;
  const runCapture=()=>html2canvas(modal,{backgroundColor:'#0d0e17',scale:2,useCORS:true}).then(canvas=>{
    const a=document.createElement('a');
    a.download=`${currentModalName}_profile.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
  }).catch(err=>{
    console.error(err);
    alert(lang==='jp'?'画像の生成に失敗しました':'Failed to generate image');
  }).finally(()=>{
    if(msLink&&msWasEnabled)msLink.disabled=false;
    modal.style.maxHeight=prevMaxH;
    scroller.style.maxHeight=prevScrollMaxH;
    scroller.style.overflow=prevOverflow;
    modal.classList.remove('capturing');
    btn.classList.remove('busy');
  });
  // フォント無効化とレイアウト再計算が確実に反映されてからキャプチャする
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve())
    .then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))))
    .then(runCapture);
}

/* ── PAGER ── */
function renderPager(){
  const tot=Math.ceil(fil.length/PG);if(tot<=1){document.getElementById('pg').innerHTML='';return;}
  const ns=[];for(let i=1;i<=tot;i++){if(i===1||i===tot||Math.abs(i-pg)<=2)ns.push(i);else if(ns[ns.length-1]!=='…')ns.push('…');}
  let h=`<button class="pgb" onclick="goP(${pg-1})" ${pg===1?'disabled':''}>◀</button>`;
  ns.forEach(n=>{if(n==='…')h+=`<span style="color:var(--t3);padding:0 4px;font-size:.7rem">…</span>`;else h+=`<button class="pgb ${n===pg?'on':''}" onclick="goP(${n})">${n}</button>`;});
  h+=`<button class="pgb" onclick="goP(${pg+1})" ${pg===tot?'disabled':''}>▶</button>`;
  document.getElementById('pg').innerHTML=h;
}
function goP(n){const t=Math.ceil(fil.length/PG);if(n<1||n>t)return;sfx('page');pg=n;renderTable();renderPager();window.scrollTo({top:0,behavior:'smooth'});}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.TM_LANG_HOOK=l=>setLang(l==='ja'?'jp':'en');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModalDirect();closeInfoOverlay();closeEventOverlay();}});

loadData();
checkActiveEvents();
setInterval(checkActiveEvents,5*60*1000);
</script>
