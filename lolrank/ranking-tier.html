    "1.0":"調和役として動くことはほぼない",
  },
  perversion: {
    "5.0":"もはや公認変態。誰も驚かなくなったレベル",
    "4.5":"変態力が振り切れ気味。油断すると際どい発言が飛んでくる",
    "4.0":"隙あらば下ネタ・きわどい発言を挟んでくる",
    "3.5":"平均よりやや際どい。たまにギリギリを攻める",
    "3.0":"たまに変態的な一面をのぞかせる",
    "2.5":"控えめだが、たまに際どい発言をする",
    "2.0":"滅多に見せないが、稀に本性が出る",
    "1.5":"ほぼ紳士(淑女)寄り。ごく稀に片鱗が見える",
    "1.0":"清廉潔白、変態要素はほぼ皆無",

function descFor(itemKey, avg){
  // 1.0〜5.0の範囲で0.5刻みに丸めて該当する説明文を返す
  const clamped = Math.min(5, Math.max(1, avg));
  const bucket = (Math.round(clamped * 2) / 2).toFixed(1);
  return SCORE_DESC[itemKey] && SCORE_DESC[itemKey][bucket] || "";
}
// Bを中心に、離れるほど加点幅を広げた配点(狂暴・優しさランキング用)
const RANK_POINT_CONVEX = { S:5, A:3.5, B:3, C:2.5, D:1 };
// Bを1点とし、離れた分×2を加点する対称配点(総合ランキング=尖り度評価用。S/Dどちらも同点)
const RANK_POINT_EXTREME = { S:5, A:3, B:1, C:3, D:5 };
// 総合ランキングの中で、extreme配点(尖り度)を使う項目=狂暴・優しさに関わる項目
const OVERALL_EXTREME_ITEMS = new Set(["aggression","harmony","devotion"]);
const MIN_VOTES = 3;

// カテゴリ別ランキング定義: どの項目を合算するか
// pointMode: "linear"(通常) / "convex"(B中心・方向あり) / "extreme"(B中心・対称) / "mixed"(項目ごとに切り替え。overall専用)
const CATEGORIES = {
  overall: { label:"総合ランキング", itemKeys:["aggression","chat","madness","devotion","influence","harmony","perversion"], pointMode:"mixed" },
  violence: { label:"狂暴ランキング", itemKeys:["aggression"], pointMode:"linear" },
  kindness: { label:"優しさランキング", itemKeys:["harmony","devotion"], pointMode:"linear" },
  perversion: { label:"変態ランキング", itemKeys:["perversion"], pointMode:"linear" },
};
let currentCategory = "overall";

// tier定義: [ラベル, cssクラス, 最小スコアの割合(0〜1、満点に対する比率)]
const TIER_RATIOS = [
  ["S+","t-Sp",0.938], ["S","t-S",0.877], ["S-","t-Sm",0.815],
  ["A+","t-Ap",0.754], ["A","t-A",0.692], ["A-","t-Am",0.631],
  ["B+","t-Bp",0.569], ["B","t-B",0.508], ["B-","t-Bm",0.446],
  ["C","t-C",0.323], ["D","t-D",0.262], ["E","t-E",0.2], ["F","t-F",0],
];
function tierOf(score, maxScore){
  const ratio = maxScore > 0 ? score / maxScore : 0;
  for (const t of TIER_RATIOS){ if (ratio >= t[2]) return t; }
  return TIER_RATIOS[TIER_RATIOS.length-1];
}

async function loadPlayers(){
  const snap = await getDocs(collection(db, "players"));
  const map = {};
  snap.docs.forEach(d => { map[d.id] = { name: d.data().name || d.id, iconUrl: d.data().iconUrl || null }; });
  return map;
}

async function loadVotes(){
  // collectionGroup: すべての ratings/*/votes/* を横断取得
  const snap = await getDocs(collectionGroup(db, "votes"));
  const byTarget = {}; // targetId -> [voteData, ...]
  snap.forEach(d => {
    const targetId = d.ref.parent.parent.id;
    if (!byTarget[targetId]) byTarget[targetId] = [];
    byTarget[targetId].push(d.data());
  });
  return byTarget;
}

function aggregate(byTarget, playersMap){
  const results = [];
  for (const targetId of Object.keys(byTarget)){
    const votes = byTarget[targetId];
    const voteCount = votes.length;
    const itemAvg = {};
    ITEM_DEFS.forEach(item => {
      const pts = votes.map(v => RANK_POINT[v[item.key]]).filter(p => p !== undefined);
      itemAvg[item.key] = pts.length ? pts.reduce((a,b)=>a+b,0) / pts.length : 0;
    });
    const categoryScores = {};
    Object.keys(CATEGORIES).forEach(catId => {
      const cat = CATEGORIES[catId];
      if (cat.pointMode === "mixed"){
        // 表示中の項目平均(itemAvg)をそのまま使い、狂暴・優しさ項目だけ
        // 「3を1点、離れた距離×2を加算」の変換をかけて合算する
        categoryScores[catId] = cat.itemKeys.reduce((sum, k) => {
          const avg = itemAvg[k] || 0;
          const val = OVERALL_EXTREME_ITEMS.has(k) ? (1 + 2 * Math.abs(avg - 3)) : avg;
          return sum + val;
        }, 0);
        return;
      }
      if (cat.pointMode === "convex"){
        // itemAvg(項目平均)を先に出してから、Bを中心にした連続的な非線形変換をかける
        // (投票ごとに変換してから平均すると詳細モーダルの内訳とズレるため、平均後に変換する)
        categoryScores[catId] = cat.itemKeys.reduce((sum, k) => {
          const avg = itemAvg[k] || 0;
          const d = avg - 3;
          const val = 3 + 0.5 * d * Math.abs(d); // 距離の2乗に比例して加点(離れるほど差が広がる)
          return sum + val;
        }, 0);
        return;
      }
      if (cat.pointMode === "extreme"){
        categoryScores[catId] = cat.itemKeys.reduce((sum, k) => {
          const avg = itemAvg[k] || 0;
          return sum + (1 + 2 * Math.abs(avg - 3));
        }, 0);
        return;
      }
      // linear(通常の平均合計)
      categoryScores[catId] = cat.itemKeys.reduce((sum, k) => sum + (itemAvg[k] || 0), 0);
    });
    const player = playersMap[targetId];
    const name = player ? player.name : (votes[0].targetName || targetId);
    const iconUrl = player ? player.iconUrl : null;
    results.push({ targetId, name, iconUrl, voteCount, itemAvg, categoryScores });
  }
  return results;
}

function renderTierList(results){
  const wrap = document.getElementById("tierWrap");
  const shown = results.filter(r => r.voteCount >= MIN_VOTES);

  if (shown.length === 0){
    wrap.innerHTML = `<div class="empty-msg">まだ${MIN_VOTES}人以上から評価されたプレイヤーがいません</div>`;
    return;
  }

  const cat = CATEGORIES[currentCategory];
  const maxScore = cat.itemKeys.length * 5;

  const grouped = {};
  TIER_RATIOS.forEach(t => grouped[t[0]] = []);
  shown.forEach(r => {
    const score = r.categoryScores[currentCategory];
    const t = tierOf(score, maxScore);
    grouped[t[0]].push({ ...r, score });
  });
  Object.values(grouped).forEach(list => list.sort((a,b) => b.score - a.score));

  wrap.innerHTML = TIER_RATIOS.map(t => {
    const [label, cls] = t;
    const list = grouped[label];
    return `
      <div class="tier-row">
        <div class="tier-label ${cls}">${label}</div>
        <div class="tier-cards">
          ${list.length === 0
            ? `<span class="tier-empty">まだ採点対象なし</span>`
            : list.map(r => `
                <div class="player-card" data-id="${r.targetId}">
                  <img src="${r.iconUrl || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(r.name)}`}" alt="">
                  <div>
                    <div class="pname">${r.name}</div>
                    <div class="pscore">${r.score.toFixed(1)} / ${maxScore}　${r.voteCount}人</div>
                  </div>
                </div>
              `).join("")
          }
        </div>
      </div>
    `;
  }).join("");

  // モーダル用にデータを保持
  window.__resultsById = {};
  shown.forEach(r => window.__resultsById[r.targetId] = r);

  [...wrap.querySelectorAll(".player-card")].forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.id));
  });
}

[...document.querySelectorAll(".tab-btn")].forEach(btn => {
  btn.addEventListener("click", () => {
    currentCategory = btn.dataset.cat;
    [...document.querySelectorAll(".tab-btn")].forEach(b => b.classList.toggle("active", b === btn));
    if (window.__allResults) renderTierList(window.__allResults);
  });
});

function buildRadarSVG(itemAvg){
  const size = 220;
  const cx = size/2, cy = size/2;
  const radius = 76;
  const maxVal = 5;
  const n = ITEM_DEFS.length;
  const angleFor = (i) => (Math.PI * 2 * i / n) - Math.PI/2;

  const pointAt = (i, val) => {
    const r = (val / maxVal) * radius;
    const a = angleFor(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };

  // グリッド(3段階の同心多角形)
  let gridPolys = "";
  [0.33, 0.66, 1.0].forEach(frac => {
    const pts = ITEM_DEFS.map((_, i) => pointAt(i, maxVal*frac).join(",")).join(" ");
    gridPolys += `<polygon points="${pts}" fill="none" stroke="#1c2230" stroke-width="1"/>`;
  });

  // 軸線
  let axisLines = "";
  ITEM_DEFS.forEach((_, i) => {
    const [x,y] = pointAt(i, maxVal);
    axisLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2230" stroke-width="1"/>`;
  });

  // データポリゴン
  const dataPts = ITEM_DEFS.map((item, i) => pointAt(i, itemAvg[item.key]).join(",")).join(" ");

  // ラベル
  let labels = "";
  ITEM_DEFS.forEach((item, i) => {
    const [x,y] = pointAt(i, maxVal * 1.22);
    labels += `<text x="${x}" y="${y}" fill="#7a8499" font-size="11" text-anchor="middle" dominant-baseline="middle">${item.name}</text>`;
  });

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${gridPolys}
      ${axisLines}
      <polygon points="${dataPts}" fill="rgba(88,101,242,0.35)" stroke="#5865F2" stroke-width="2"/>
      ${labels}
    </svg>
  `;
}

function openModal(id){
  const r = window.__resultsById[id];
  if (!r) return;
  const cat = CATEGORIES[currentCategory];
  document.getElementById("modalIcon").src =
    r.iconUrl || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(r.name)}`;
  document.getElementById("modalName").textContent = r.name;
  document.getElementById("modalSub").textContent =
    `${cat.label}: ${r.categoryScores[currentCategory].toFixed(1)} / ${cat.itemKeys.length*5}　評価人数 ${r.voteCount}人`;
  document.getElementById("modalRadar").innerHTML = buildRadarSVG(r.itemAvg);
  document.getElementById("modalItems").innerHTML = ITEM_DEFS.map(item => `
    <div class="item-line" style="${cat.itemKeys.includes(item.key) ? 'font-weight:700;' : 'color:var(--dim);'}">
      <span>${item.name}${cat.itemKeys.includes(item.key) ? " ★" : ""}</span><span>${r.itemAvg[item.key].toFixed(1)}</span>
    </div>
    <div class="item-desc">${descFor(item.key, r.itemAvg[item.key])}</div>
  `).join("");
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("modalBg").classList.remove("show");
});
document.getElementById("modalBg").addEventListener("click", (e) => {
  if (e.target.id === "modalBg") document.getElementById("modalBg").classList.remove("show");
});

const CACHE_TTL_MS = 15 * 60 * 1000; // 15分間はキャッシュを使い回す

async function init(){
  try {
    let results = null;
    let usedCache = false;

    // まずキャッシュ(集計済みの結果1件)を読む。読み取りコストは常に1件のみ
    try {
      const cacheRef = doc(db, "aggregates", "rankings");
      const cacheSnap = await getDoc(cacheRef);
      if (cacheSnap.exists()){
        const data = cacheSnap.data();
        const updatedAtMs = data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : 0;
        if (Date.now() - updatedAtMs < CACHE_TTL_MS && Array.isArray(data.results)){
          results = data.results;
          usedCache = true;
        }
      }
    } catch(e){ console.warn("キャッシュの読み込みに失敗", e); }

    // キャッシュが無い/古い場合だけ、全投票データを読んで再集計する(コストが高い処理)
    if (!usedCache){
      const [playersMap, byTarget] = await Promise.all([loadPlayers(), loadVotes()]);
      results = aggregate(byTarget, playersMap);
      // 次の閲覧者のためにキャッシュを書き戻す(失敗しても表示自体は継続)
      const cacheRef = doc(db, "aggregates", "rankings");
      setDoc(cacheRef, { results, updatedAt: serverTimestamp() }).catch(e => console.warn("キャッシュの書き込みに失敗", e));
    }

    window.__allResults = results;
    renderTierList(results);
  } catch(e){
    console.error(e);
    document.getElementById("tierWrap").innerHTML =
      `<div class="empty-msg">ランキングの読み込みに失敗しました</div>`;
  }
}
init();
</script>
