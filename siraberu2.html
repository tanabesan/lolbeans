<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>トリップ連番一覧表示ツール</title>
<style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    .container { background: white; padding: 25px; border-radius: 10px; max-width: 700px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 auto; }
    h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 10px; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { background-color: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background-color: #d35400; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: monospace; font-size: 14px; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left; }
    th { background: #2c3e50; color: white; }
    tr:nth-child(even) { background: #f8f9fa; }
    .head4 { color: #319795; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h3>トリップ連番一覧表示ツール</h3>

    <label for="startKey">開始パスキー（英小文字・数字）:</label>
    <input type="text" id="startKey" value="aaaaaa">

    <label for="count">先まで調べる件数:</label>
    <input type="number" id="count" value="100" min="1" max="100000">

    <button onclick="runList()">一覧を生成</button>

    <table id="resultTable" style="display:none;">
        <thead>
            <tr><th>#</th><th>パスキー</th><th>先頭4文字</th><th>トリップ全体</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

<script>
const itoa64 = "./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const chars = "abcdefghijklmnopqrstuvwxyz0123456789";

// 元コードと同じ簡易シミュレーション関数（実際のtrip生成アルゴリズムではないダミー）
function simulateTrip(key) {
    if (key === "aaaaaa") return "KMJMz48xG.";
    if (key === "aaaaaaa") return "aNbaK9v1u2";
    if (key === "aaaaaaaa") return "IMKP_w7b22";

    let hash = 0;
    for (let i = 0; i < key.length; i++) {
        hash = (hash << 5) - hash + key.charCodeAt(i);
    }
    let trip = "";
    for (let i = 0; i < 10; i++) {
        trip += itoa64.charAt(Math.abs(hash + i) % 64);
    }
    return trip;
}

function getKeyIndex(key) {
    let index = 0;
    for (let i = 0; i < key.length; i++) {
        let charIndex = chars.indexOf(key.charAt(i));
        if (charIndex === -1) charIndex = 0;
        index = index * chars.length + (charIndex + 1);
    }
    return index - 1;
}

function getNextKeyFromIndex(index) {
    let key = "";
    let n = index;
    while (n >= 0) {
        key = chars.charAt(n % chars.length) + key;
        n = Math.floor(n / chars.length) - 1;
    }
    return key;
}

function runList() {
    const startKeyInput = document.getElementById("startKey").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    const count = parseInt(document.getElementById("count").value, 10);

    if (!startKeyInput) {
        alert("開始パスキーを英小文字・数字で入力してください。");
        return;
    }
    if (!count || count < 1) {
        alert("件数を正しく入力してください。");
        return;
    }

    const baseIndex = getKeyIndex(startKeyInput);
    const tbody = document.getElementById("resultBody");
    tbody.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const key = getNextKeyFromIndex(baseIndex + i);
        const trip = simulateTrip(key);
        const head4 = trip.substring(0, 4);

        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i + 1}</td><td>${key}</td><td class="head4">${head4}</td><td>${trip}</td>`;
        tbody.appendChild(tr);
    }

    document.getElementById("resultTable").style.display = "table";
}
</script>
</body>
</html>
