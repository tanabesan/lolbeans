<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" type="image/png" href="https://tanabesan.github.io/lolbeans/file/page/favicon.png">

    <meta property="og:title" content="LOL.ex ファイルライブラリ">
    <meta property="og:description" content="LOLBeansのエディター用ファイルをダウンロードできるライブラリです。">
    <meta property="og:url" content="https://tanabesan.github.io/lolbeans/file.html">
    <meta property="og:image" content="https://tanabesan.github.io/lolbeans/file/page/7396.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LOL.ex 公式サイト">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOL.ex - ファイル配布</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0d0e17;
            --panel: #171a29;
            --panel-line: #2c3044;
            --text: #d8dce8;
            --text-dim: #6b7189;
            --accent: #ff00ff;
            --accent2: #00ffff;
            --accent-dim: #7a2f7a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        .pixel-noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--panel-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.12;
            z-index: 0;
        }

        .hero-section {
            position: relative;
            z-index: 1;
            background:
                linear-gradient(rgba(13,14,23,0.75), rgba(13,14,23,0.9)),
                url('https://tanabesan.github.io/lolbeans/file/page/7396.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text);
            padding: 120px 20px 90px;
            text-align: center;
            border-bottom: 2px solid var(--panel-line);
        }
        .hero-section h1 {
            font-family: 'Press Start 2P', monospace;
            font-weight: normal;
            font-size: 22px;
            letter-spacing: 1px;
            margin: 0 0 16px;
            color: #fff;
            text-shadow: 3px 3px 0 var(--accent-dim), 0 0 16px rgba(0,255,255,0.35);
        }
        .hero-section p {
            font-size: 0.95em;
            font-weight: 400;
            margin: 0;
            color: var(--text-dim);
        }

        .navbar {
            position: fixed;
            top: 16px;
            right: 16px;
            background-color: rgba(23, 26, 41, 0.92);
            border: 2px solid var(--panel-line);
            padding: 8px 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
        }
        .navbar a {
            color: var(--text-dim);
            text-decoration: none;
            margin: 0 12px;
            font-size: 12px;
            transition: color 0.2s ease;
            display: inline-block;
        }
        .navbar a:hover { color: var(--accent2); }

        #language-switcher {
            padding: 6px 8px;
            border: 2px solid var(--panel-line);
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            margin-left: 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .hamburger-menu {
            display: none;
            cursor: pointer;
            font-size: 1.3em;
            color: var(--text);
            padding: 5px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        .filter-button {
            background-color: var(--panel);
            color: var(--text-dim);
            border: 2px solid var(--panel-line);
            padding: 8px 16px;
            margin: 0 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        .filter-button:hover { border-color: var(--accent2); color: var(--accent2); }
        .filter-button.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #0b0715;
            font-weight: 700;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }
        @media (max-width: 900px) {
            .download-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .download-grid { grid-template-columns: 1fr; }
        }

        .download-item-card {
            background: var(--panel);
            border: 2px solid var(--panel-line);
            transition: border-color 0.2s ease, transform 0.15s ease;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .download-item-card:hover {
            border-color: var(--accent2);
            transform: translate(-2px, -2px);
        }
        .download-item-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            filter: saturate(1.1);
        }
        .file-info-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #0b0715;
        }
        .badge-lol { background-color: var(--accent2); }
        .badge-glol { background-color: var(--accent); }
        .badge-glol-template { background-color: #ffe066; }

        .download-item-content { padding: 20px; }
        .download-item-content h3 {
            font-size: 1em;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 6px;
        }
        .author-name {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .download-count {
            font-size: 11px;
            color: var(--accent2);
            margin-bottom: 12px;
        }
        .download-item-content p {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }
        .download-button-small {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--accent2);
            color: #0b0715;
            font-weight: 700;
            text-decoration: none;
            font-size: 12px;
            transition: background-color 0.2s ease;
        }
        .download-button-small:hover { background-color: #66ffff; }

        .submit-cta {
            text-align: center;
            margin: 8px 0 48px;
        }
        .submit-cta a {
            display: inline-block;
            padding: 13px 28px;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .submit-cta a:hover { background-color: var(--accent); color: #0b0715; }

        .footer-section {
            position: relative;
            z-index: 1;
            border-top: 2px solid var(--panel-line);
            padding: 40px 20px;
            text-align: center;
            margin-top: 20px;
        }
        .footer-section .social-icons a {
            color: var(--text-dim);
            font-size: 1.2em;
            margin: 0 12px;
            transition: color 0.2s ease;
        }
        .footer-section .social-icons a:hover { color: var(--accent2); }
        .footer-section p {
            margin-top: 15px;
            font-size: 11px;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .navbar a { display: none; }
            #language-switcher { margin-left: 0; }
            .navbar {
                background-color: transparent;
                border: none;
                padding: 10px;
                flex-direction: column-reverse;
                align-items: flex-end;
            }
            .hamburger-menu { display: block; margin-bottom: 10px; }
            .navbar.open a { display: block; margin: 10px 0; }
            .navbar.open {
                background-color: rgba(23, 26, 41, 0.96);
                border: 2px solid var(--panel-line);
                padding: 20px;
                display: flex;
            }
            .navbar.open #language-switcher { display: block; width: 100%; margin: 10px 0; }
        }
    </style>
</head>
<body>

    <div class="pixel-noise"></div>

    <header class="hero-section">
        <h1 id="hero-title">LOL.ex ファイルライブラリ</h1>
        <p id="hero-subtitle">エディター用ファイルをダウンロード</p>
    </header>

    <nav class="navbar">
        <div class="hamburger-menu" id="hamburger-icon"><i class="fas fa-bars"></i></div>
        <a id="nav-main-page" href="https://tanabesan.github.io/lolbeans/">メインページ</a>
        <a id="nav-file-library" href="https://tanabesan.github.io/lolbeans/file.html">ファイルライブラリ</a>
        <a id="nav-community" href="community.html">コミュ一覧</a>
        <a id="nav-faq" href="https://tanabesan.github.io/lolbeans/faq.html">よくある質問</a>
        <a id="nav-contact" href="https://tanabesan.github.io/lolbeans/contact.html">お問い合わせ</a>
        <select id="language-switcher">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </nav>

    <main class="container">
        <section id="download-items" style="text-align: center;">
            <h2 id="available-files-title" style="font-family:'Press Start 2P',monospace; font-size:14px; font-weight:normal; color:var(--accent2);">利用可能なファイル</h2>
            <p id="description-text" style="max-width: 700px; margin: 16px auto 32px; font-size: 12px; color: var(--text-dim);">
                ここでは、LOL.exのゲーム内エディターで使用できる様々なファイルをダウンロードできます。お好みのファイルを選んで、コースをさらに豊かにしましょう。
            </p>

            <div class="submit-cta">
                <a href="submit.html">+ ファイルを投稿する</a>
            </div>

            <div class="filter-tags" style="margin-bottom: 20px; text-align: center;">
                <button class="filter-button active" data-filter="all">すべて</button>
                <button class="filter-button" data-filter="lol">.lol</button>
                <button class="filter-button" data-filter="glol">.glol</button>
                <button class="filter-button" data-filter="glol-template">.glol (template)</button>
            </div>

            <div style="margin-bottom: 30px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto;">
                <input type="text" id="search-input" placeholder="ファイル名や作者名で検索..." style="width: 100%; padding: 12px; font-size: 14px; font-family: 'JetBrains Mono', monospace; background: var(--panel); color: var(--text); border: 2px solid var(--panel-line); box-sizing: border-box;">
            </div>

            <div id="file-list" class="download-grid">
            </div>
        </section>
    </main>

    <footer class="footer-section">
        <div class="social-icons">
            <a href="https://www.youtube.com/@lol-extension"><i class="fab fa-youtube"></i></a>
            <a href="https://discord.gg/Cpu8vFDmH3"><i class="fab fa-discord"></i></a>
            <a href="https://github.com/tanabesan/"><i class="fab fa-github"></i></a>
        </div>
        <p style="margin-top: 15px;">2025 Yuki.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDocs, collection, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJqqCzt_xppIt0lg3ItQfPwoR9uLWRWZI",
            authDomain: "lolex0204.firebaseapp.com",
            projectId: "lolex0204",
            storageBucket: "lolex0204.firebasestorage.app",
            messagingSenderId: "940620254622",
            appId: "1:940620254622:web:edca80d191423cd460da8f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ダウンロード数を読み込んでグローバルに公開(下の通常scriptから参照する)
        window.__downloadCounts = {};
        getDocs(collection(db, "downloadCounts")).then(snapshot => {
            snapshot.forEach(d => {
                window.__downloadCounts[d.id] = d.data().count || 0;
            });
            if (window.__renderFilesIfReady) window.__renderFilesIfReady();
        }).catch(err => {
            console.error("ダウンロード数の取得に失敗:", err);
            if (window.__renderFilesIfReady) window.__renderFilesIfReady();
        });

        // ダウンロードボタンが押された時にカウントを+1する
        window.__incrementDownloadCount = async (fileId) => {
            if (!fileId) return;
            try {
                await setDoc(doc(db, "downloadCounts", fileId), { count: increment(1) }, { merge: true });
            } catch (err) {
                console.error("ダウンロード数の更新に失敗:", err);
            }
        };
    </script>

    <script>
        const translations = {
            ja: {
                mainPage: "メインページ",
                community: "コミュ一覧",
                fileLibrary: "ファイルライブラリ",
                faq: "よくある質問",
                contact: "お問い合わせ",
                heroTitle: "LOL.ex ファイルライブラリ",
                heroSubtitle: "エディター用ファイルをダウンロード",
                availableFiles: "利用可能なファイル",
                descriptionText: "ここでは、LOL.exのゲーム内エディターで使用できる様々なファイルをダウンロードできます。お好みのファイルを選んで、コースをさらに豊かにしましょう。",
                searchPlaceholder: "ファイル名や作者名で検索...",
                allFilter: "すべて",
                noResults: "検索結果が見つかりませんでした。",
                loadingError: "ファイルの読み込みに失敗しました。後でもう一度お試しください。",
                downloadButton: "ダウンロード"
            },
            en: {
                mainPage: "Main Page",
                community: "Community List",
                fileLibrary: "File Library",
                faq: "FAQ",
                contact: "Contact",
                heroTitle: "LOL.ex File Library",
                heroSubtitle: "Download editor files",
                availableFiles: "Available Files",
                descriptionText: "Here, you can download various files for the LOL.ex in-game editor. Choose your favorite files to enrich your courses.",
                searchPlaceholder: "Search by file name or author...",
                allFilter: "All",
                noResults: "No results found.",
                loadingError: "Failed to load files. Please try again later.",
                downloadButton: "Download"
            }
        };

        const applyLanguage = (lang) => {
            localStorage.setItem('language', lang);
            const langData = translations[lang];

            document.title = langData.heroTitle;

            document.getElementById('nav-main-page').textContent = langData.mainPage;
            document.getElementById('nav-community').textContent = langData.community;
            document.getElementById('nav-file-library').textContent = langData.fileLibrary;
            document.getElementById('nav-faq').textContent = langData.faq;
            document.getElementById('nav-contact').textContent = langData.contact;

            document.getElementById('hero-title').textContent = langData.heroTitle;
            document.getElementById('hero-subtitle').textContent = langData.heroSubtitle;
            document.getElementById('available-files-title').textContent = langData.availableFiles;
            document.getElementById('description-text').textContent = langData.descriptionText;
            document.getElementById('search-input').placeholder = langData.searchPlaceholder;
            document.querySelector('.filter-button[data-filter="all"]').textContent = langData.allFilter;

            document.getElementById('language-switcher').value = lang;
        };

        document.addEventListener('DOMContentLoaded', () => {
            const fileListContainer = document.getElementById('file-list');
            const searchInput = document.getElementById('search-input');
            const hamburgerIcon = document.getElementById('hamburger-icon');
            const navbar = document.querySelector('.navbar');
            const filterButtons = document.querySelectorAll('.filter-button');
            const languageSwitcher = document.getElementById('language-switcher');
            let allFiles = [];

            const savedLang = localStorage.getItem('language') || 'ja';
            applyLanguage(savedLang);

            const filterAndDisplayFiles = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const activeFilter = document.querySelector('.filter-button.active').dataset.filter;

                const filteredFiles = allFiles.filter(file => {
                    const matchesSearch =
                        file.title.toLowerCase().includes(searchTerm) ||
                        file.author.toLowerCase().includes(searchTerm) ||
                        file.description.toLowerCase().includes(searchTerm);

                    const matchesFilter = (activeFilter === 'all' || file.type === activeFilter);

                    return matchesSearch && matchesFilter;
                });
                displayFiles(filteredFiles);
            };

            let filesDataReady = false;
            let filteredFilesCache = [];

            const displayFiles = (files) => {
                filesDataReady = true;
                filteredFilesCache = files;
                fileListContainer.innerHTML = '';
                const langData = translations[localStorage.getItem('language') || 'ja'];

                if (files.length === 0) {
                    fileListContainer.innerHTML = `<p style="text-align: center; color: var(--text-dim);">${langData.noResults}</p>`;
                    return;
                }
                files.forEach(item => {
                    const typeLabel = item.type === 'glol-template' ? 'GLOL-T' : item.type.toUpperCase();
                    const count = (window.__downloadCounts && window.__downloadCounts[item.id]) || 0;
                    const cardHtml = `
                        <div class="download-item-card">
                            <img src="${item.thumbnailUrl}" alt="${item.title}のサムネイル">
                            <span class="file-info-badge badge-${item.type}">${typeLabel}</span>
                            <div class="download-item-content">
                                <h3>${item.title}</h3>
                                <p class="author-name">by ${item.author}</p>
                                <p class="download-count">⬇ ${count} 回ダウンロード</p>
                                <p>${item.description}</p>
                                <a href="${item.downloadUrl}" class="download-button-small" data-file-id="${item.id || ''}">${langData.downloadButton}</a>
                            </div>
                        </div>
                    `;
                    fileListContainer.innerHTML += cardHtml;
                });
            };

            // Firestoreのダウンロード数取得が終わった後に再描画するためのフック
            window.__renderFilesIfReady = () => {
                if (filesDataReady) displayFiles(filteredFilesCache);
            };

            // ダウンロードボタンのクリックをイベント委譲でハンドリング(カウント+1)
            fileListContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.download-button-small');
                if (btn && btn.dataset.fileId && window.__incrementDownloadCount) {
                    window.__incrementDownloadCount(btn.dataset.fileId);
                }
            });

            fetch('data.json', { cache: 'no-cache' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    allFiles = data;
                    filterAndDisplayFiles();
                })
                .catch(error => {
                    console.error('ファイルの読み込みに失敗しました:', error);
                    const langData = translations[localStorage.getItem('language') || 'ja'];
                    fileListContainer.innerHTML = `<p style="color: #ff5f7a; text-align: center;">${langData.loadingError}</p>`;
                });

            searchInput.addEventListener('keyup', () => {
                filterAndDisplayFiles();
            });

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    filterAndDisplayFiles();
                });
            });

            languageSwitcher.addEventListener('change', (event) => {
                applyLanguage(event.target.value);
                filterAndDisplayFiles();
            });

            hamburgerIcon.addEventListener('click', () => {
                navbar.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
