<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0b12">
<title>IMAGE → GLOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #0a0b12; --slab: #10121c; --well: #0b0d16;
    --rule: #262a40; --rule-hi: #3a3f5e;
    --bone: #e9ebf5; --mute: #8d92b2;
    --cyan: #19e3f5; --magenta: #ff3fd0; --err: #ff7a8a;
    /* nav-menu.js が参照する変数名(サイト共通) */
    --panel: var(--slab); --panel-line: var(--rule);
    --text: var(--bone); --text-dim: var(--mute);
    --accent: var(--magenta); --accent2: var(--cyan);
    --display: "Chakra Petch", "IBM Plex Sans JP", sans-serif;
    --body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--bone);
    font: 14px/1.6 var(--body); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 64px 24px 24px;
  }
  .page { width: 100%; max-width: 1040px; }

  /* ---- 見出し(1行にまとめる) ---- */
  .hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 20px; margin-bottom: 16px; }
  h1 { font: 600 clamp(26px, 4vw, 34px)/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
  .sub { margin: 0; color: var(--mute); font-size: 13px; }

  /* ---- 作業台: 左=設定 / 右=プレビュー ---- */
  .bench {
    display: grid; grid-template-columns: 380px 1fr;
    border: 1px solid var(--rule); border-radius: 14px; background: var(--slab); overflow: hidden;
  }
  .col { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--rule); }

  /* ---- ドロップ領域(選んだ写真がサムネイルで出る) ---- */
  #drop {
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    padding: 12px; border-radius: 10px;
    border: 1px dashed var(--rule-hi); background: var(--well);
    transition: border-color .2s, background .2s;
  }
  #drop:hover { border-color: var(--mute); }
  #drop.over { border-color: var(--cyan); border-style: solid; background: rgba(25, 227, 245, .06); }
  #drop:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .frame {
    flex: none; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--rule-hi); background: #151828;
    display: grid; place-items: center; color: var(--rule-hi);
  }
  .frame svg { width: 32px; height: 32px; }
  .frame img { display: none; width: 100%; height: 100%; object-fit: cover; }
  #drop.has-img .frame { border-color: rgba(25, 227, 245, .5); }
  #drop.has-img .frame img { display: block; }
  #drop.has-img .frame svg { display: none; }
  .dtext { min-width: 0; }
  .l1 { display: block; font-size: 15px; font-weight: 600; line-height: 1.4; }
  .l2 { display: block; color: var(--mute); font-size: 12.5px; }
  #fname {
    display: inline-block; margin-top: 6px; padding: 1px 8px; border-radius: 6px; word-break: break-all;
    font: 11.5px/1.5 var(--mono); color: var(--bone);
    background: rgba(25, 227, 245, .09); border: 1px solid rgba(25, 227, 245, .3);
  }
  #fname:empty { display: none; }

  /* ---- 設定 ---- */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--bone); }
  .field input[type=number], .field input[type=text] {
    width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--rule); padding: 0 12px;
    background: var(--well); color: var(--bone); font: 13.5px var(--mono);
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:hover { border-color: var(--rule-hi); }
  .field input:focus-visible { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(25, 227, 245, .18); }
  .field b { font: 500 12px var(--mono); color: var(--cyan); margin-left: 6px; }
  input[type=range] { accent-color: var(--cyan); width: 100%; height: 22px; margin: 0; cursor: pointer; }

  .switch-row {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--well);
    font-size: 12.5px; color: var(--bone); transition: border-color .15s;
  }
  .switch-row:hover { border-color: var(--rule-hi); }
  .switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; border-radius: 99px; background: #23273d; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); transition: transform .2s, background .2s; }
  .switch-row input:checked + .switch { background: var(--cyan); }
  .switch-row input:checked + .switch::after { transform: translateX(16px); background: #041014; }
  .switch-row input:focus-visible + .switch { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* ---- ボタン ---- */
  #convertBtn {
    display: block; width: 100%; height: 44px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--cyan); color: #041014; font: 600 14.5px var(--body);
    transition: filter .15s, transform .1s;
  }
  #convertBtn:hover:not(:disabled) { filter: brightness(1.1); }
  #convertBtn:active:not(:disabled) { transform: translateY(1px); }
  #convertBtn:disabled { background: #1b2030; color: #5b6180; cursor: not-allowed; }
  #downloadBtn {
    display: none; width: 100%; height: 44px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--cyan); background: transparent; color: var(--cyan); font: 600 14.5px var(--body);
    transition: background .15s;
  }
  #downloadBtn:hover { background: rgba(25, 227, 245, .1); }
  #convertBtn:focus-visible, #downloadBtn:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }

  #err { display: none; color: var(--err); font-size: 12.5px; }
  .stats {
    padding: 10px 14px; border-radius: 4px 8px 8px 4px;
    background: var(--well); border: 1px solid var(--rule); border-left: 2px solid var(--cyan);
    font: 12px/1.7 var(--mono); color: #aee9f1;
  }
  .stats span { color: var(--bone); font-weight: 700; }

  /* ---- プレビュー ---- */
  .stage {
    flex: 1; display: grid; place-items: center; min-height: 300px; padding: 14px; border-radius: 10px;
    border: 1px solid var(--rule); background-color: var(--well);
    background-image:
      linear-gradient(45deg, #151828 25%, transparent 25%, transparent 75%, #151828 75%),
      linear-gradient(45deg, #151828 25%, transparent 25%, transparent 75%, #151828 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  canvas#preview {
    image-rendering: pixelated; image-rendering: crisp-edges; display: block;
    max-width: 100%; max-height: calc(100vh - 230px); border-radius: 4px;
    box-shadow: 0 0 0 1px var(--rule-hi);
  }
  .empty-state { color: var(--mute); font-size: 13px; text-align: center; padding: 24px; }

  @media (max-width: 820px) {
    body { padding: 72px 14px 32px; }
    .bench { grid-template-columns: 1fr; }
    .col + .col { border-left: 0; border-top: 1px solid var(--rule); }
    .stage { min-height: 220px; }
    canvas#preview { max-height: 50vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-nav-current="template">
<script src="https://tanabesan.github.io/lolbeans/tools-i18n.js" defer></script>
<script src="https://tanabesan.github.io/lolbeans/nav-menu.js" defer></script>

<main class="page">
  <header class="hero">
    <h1>IMAGE → GLOL</h1>
    <p class="sub">画像を LOLBeans の Solid Pane ピクセルアートに変換(処理はブラウザ内で完結)</p>
  </header>

  <div class="bench">
    <div class="col">
      <div id="drop" role="button" tabindex="0" aria-label="Select an image">
        <div class="frame">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
          <img id="thumb" alt="">
        </div>
        <div class="dtext">
          <span class="l1">画像をドラッグ&amp;ドロップ</span>
          <span class="l2">またはクリックして選択</span>
          <div id="fname"></div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>

      <div class="field">グリッドサイズ (ブロック数: 幅 / 高さ)
        <div class="row">
          <input type="number" id="gridW" value="32" min="1" max="128" aria-label="幅">
          <input type="number" id="gridH" value="32" min="1" max="128" aria-label="高さ">
        </div>
      </div>
      <label class="switch-row">
        <input type="checkbox" id="lockAspect" checked>
        <span class="switch" aria-hidden="true"></span>
        元画像の縦横比に合わせる
      </label>

      <label class="field">グループ名
        <input type="text" id="groupName" value="Converted">
      </label>

      <div class="row">
        <label class="field">彩度<b id="satVal">1.0</b>
          <input type="range" id="saturation" min="0.5" max="2" step="0.05" value="1">
        </label>
        <label class="field">明度<b id="briVal">1.0</b>
          <input type="range" id="brightness" min="0.5" max="1.5" step="0.05" value="1">
        </label>
      </div>

      <label class="switch-row">
        <input type="checkbox" id="keepTransparent">
        <span class="switch" aria-hidden="true"></span>
        透明ピクセルもブロック化する
      </label>

      <button id="convertBtn" disabled>変換する</button>
      <div id="err"></div>
    </div>

    <div class="col">
      <div class="stage">
        <canvas id="preview" width="1" height="1"></canvas>
        <div class="empty-state" id="emptyState">画像を選択するとここにピクセル化プレビューが表示されます</div>
      </div>
      <div class="stats" id="stats">画像を選んでください。</div>
      <button id="downloadBtn">.glol をダウンロード</button>
    </div>
  </div>
</main>

<script>
const BLOCK_ID = 500;
const BLOCK_NAME = "Solid Pane";
const SPACING = 1.0;
const DEFAULT_QUATERNION = { x: 0, y: -0.7071067811865475, z: 0, w: 0.7071067811865476 };

let sourceImg = null;
let lastGlol = null;
let aspectRatio = 1;
let syncing = false;

const gridWInput = document.getElementById('gridW');
const gridHInput = document.getElementById('gridH');
const lockAspectEl = document.getElementById('lockAspect');

gridWInput.addEventListener('input', () => {
  if (syncing || !lockAspectEl.checked) return;
  syncing = true;
  const w = parseInt(gridWInput.value, 10);
  if (w > 0) gridHInput.value = Math.max(1, Math.round(w / aspectRatio));
  syncing = false;
});

gridHInput.addEventListener('input', () => {
  if (syncing || !lockAspectEl.checked) return;
  syncing = true;
  const h = parseInt(gridHInput.value, 10);
  if (h > 0) gridWInput.value = Math.max(1, Math.round(h * aspectRatio));
  syncing = false;
});

const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewCanvas = document.getElementById('preview');
const emptyState = document.getElementById('emptyState');
const fnameEl = document.getElementById('fname');
const thumb = document.getElementById('thumb');
const statsEl = document.getElementById('stats');
const errEl = document.getElementById('err');

dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('over'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      sourceImg = img;
      aspectRatio = img.naturalWidth / img.naturalHeight;
      fnameEl.textContent = file.name;
      thumb.src = ev.target.result;
      dropEl.classList.add('has-img');
      convertBtn.disabled = false;
      errEl.style.display = 'none';

      if (lockAspectEl.checked) {
        syncing = true;
        const w = parseInt(gridWInput.value, 10) || 32;
        gridHInput.value = Math.max(1, Math.round(w / aspectRatio));
        syncing = false;
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

convertBtn.addEventListener('click', convert);

function rgbToTint(r, g, b) {
  return (r << 16) + (g << 8) + b;
}

function adjustColor(r, g, b, saturation, brightness) {
  const gray = 0.299 * r + 0.587 * g + 0.114 * b;
  r = gray + (r - gray) * saturation;
  g = gray + (g - gray) * saturation;
  b = gray + (b - gray) * saturation;
  r *= brightness; g *= brightness; b *= brightness;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  return [clamp(r), clamp(g), clamp(b)];
}

const saturationInput = document.getElementById('saturation');
const brightnessInput = document.getElementById('brightness');
const satVal = document.getElementById('satVal');
const briVal = document.getElementById('briVal');
saturationInput.addEventListener('input', () => satVal.textContent = parseFloat(saturationInput.value).toFixed(2));
brightnessInput.addEventListener('input', () => briVal.textContent = parseFloat(brightnessInput.value).toFixed(2));

function convert() {
  errEl.style.display = 'none';
  const gw = parseInt(document.getElementById('gridW').value, 10);
  const gh = parseInt(document.getElementById('gridH').value, 10);
  const groupName = document.getElementById('groupName').value || 'Converted';
  const keepTransparent = document.getElementById('keepTransparent').checked;
  const saturation = parseFloat(saturationInput.value);
  const brightness = parseFloat(brightnessInput.value);

  if (!sourceImg || !gw || !gh || gw < 1 || gh < 1) {
    errEl.textContent = '画像とグリッドサイズを正しく指定してください';
    errEl.style.display = 'block';
    return;
  }

  // ソースをグリッドサイズにニアレストネイバーで縮小
  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = gw;
  sampleCanvas.height = gh;
  const sctx = sampleCanvas.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(sourceImg, 0, 0, gw, gh);
  const data = sctx.getImageData(0, 0, gw, gh).data;

  function getTint(col, row) {
    const idx = (row * gw + col) * 4;
    const a = data[idx + 3];
    if (!keepTransparent && a < 10) return null;
    const [r, g, b] = adjustColor(data[idx], data[idx + 1], data[idx + 2], saturation, brightness);
    return rgbToTint(r, g, b);
  }

  // 1st pass: 各行で横方向のラン(同色の連続)を検出
  const rowRuns = [];
  for (let row = 0; row < gh; row++) {
    const runs = [];
    let col = 0;
    while (col < gw) {
      const tint = getTint(col, row);
      if (tint === null) { col++; continue; }
      let runLen = 1;
      while (col + runLen < gw && getTint(col + runLen, row) === tint) {
        runLen++;
      }
      runs.push([col, runLen, tint]);
      col += runLen;
    }
    rowRuns.push(runs);
  }

  // 2nd pass: 同じ幅・同じ色の横ランが縦に連続していたら1つの大きいブロックにまとめる
  const blocks = [];
  const ids = [];
  let nextId = 1;
  const openBlocks = new Map(); // key "col,len,tint" -> {startRow, height}

  function flush(key, info) {
    const [colStart, runLen, tint] = key.split(',').map(Number);
    const { startRow, height } = info;
    const x = colStart * SPACING + (runLen - 1) * SPACING / 2;
    // scale.y は下端がピボットで上方向にだけ伸びるので、縦ランの一番下の行の位置を使う
    const bottomRow = startRow + height - 1;
    const y = -0.5 - bottomRow * SPACING;
    const z = 0;
    const block = {
      id: nextId,
      blockId: BLOCK_ID,
      name: BLOCK_NAME,
      type: "static",
      position: { x, y, z },
      quaternion: { ...DEFAULT_QUATERNION },
      tintColor: tint
    };
    // 90度回転しているため、横幅はローカルz軸、縦幅はローカルy軸のスケールで伸ばす
    if (runLen > 1 || height > 1) {
      block.scale = { x: 1, y: height, z: runLen };
    }
    blocks.push(block);
    ids.push(nextId);
    nextId++;
  }

  for (let row = 0; row < gh; row++) {
    const currentKeys = new Set(rowRuns[row].map(r => r.join(',')));
    for (const key of Array.from(openBlocks.keys())) {
      if (!currentKeys.has(key)) {
        flush(key, openBlocks.get(key));
        openBlocks.delete(key);
      }
    }
    for (const r of rowRuns[row]) {
      const key = r.join(',');
      if (openBlocks.has(key)) {
        openBlocks.get(key).height++;
      } else {
        openBlocks.set(key, { startRow: row, height: 1 });
      }
    }
  }
  for (const [key, info] of openBlocks) {
    flush(key, info);
  }

  lastGlol = {
    blocks,
    groups: { [groupName]: ids },
    version: 3
  };

  // プレビュー描画(拡大して見やすく、ドット感を保持)
  const availW = Math.min(window.innerWidth * 0.8, 480);
  const displayScale = Math.max(1, Math.floor(availW / Math.max(gw, gh)));
  previewCanvas.width = gw * displayScale;
  previewCanvas.height = gh * displayScale;
  const pctx = previewCanvas.getContext('2d');
  pctx.imageSmoothingEnabled = false;
  pctx.drawImage(sampleCanvas, 0, 0, gw * displayScale, gh * displayScale);
  emptyState.style.display = 'none';
  previewCanvas.style.display = 'block';

  statsEl.innerHTML = `ブロック数: <span>${blocks.length}</span> (${gw * gh}ピクセル中)<br>グリッド: <span>${gw} × ${gh}</span>`;
  downloadBtn.style.display = 'block';
}

downloadBtn.addEventListener('click', () => {
  if (!lastGlol) return;
  const blob = new Blob([JSON.stringify(lastGlol)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (document.getElementById('groupName').value || 'converted') + '.glol';
  a.click();
  URL.revokeObjectURL(url);
});

previewCanvas.style.display = 'none';
</script>

</body>
</html>
