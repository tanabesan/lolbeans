<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビーンズランク | LOLBeans</title>
<style>
  :root{
    --bg:#05070c;
    --panel:#0d111a;
    --panel2:#11151f;
    --line:#1c2230;
    --accent:#5865F2;
    --text:#e7ecf5;
    --dim:#7a8499;
    --dim2:#4d5567;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size:14px;
  }
  header{
    display:flex; align-items:center; gap:16px;
    padding:14px 24px; border-bottom:1px solid var(--line);
  }
  header img{ width:36px; height:36px; border-radius:50%; }
  header .brand{ font-weight:700; font-size:16px; }
  header nav{ display:flex; gap:18px; margin-left:12px; flex-wrap:wrap; }
  header nav a{ color:var(--dim); text-decoration:none; font-size:13px; }
  header nav a:hover{ color:var(--text); }

  .lead{
    max-width:900px;
    margin: 18px auto 0;
    padding: 0 20px;
    color: var(--dim);
    font-size:13px;
    line-height:1.8;
  }
  .lead a{ color:#8ab4ff; }

  .wrap{
    max-width:900px;
    margin: 18px auto 60px;
    padding: 0 20px;
  }

  .tier-row{
    display:grid;
    grid-template-columns: 84px 1fr;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .tier-label{
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800;
    color:#05070c;
  }
  .tier-cards{
    background: var(--panel);
    padding:12px;
    display:flex; flex-wrap:wrap; gap:10px;
    min-height:58px;
    align-items:center;
  }
  .tier-empty{ color:var(--dim2); font-size:12px; padding-left:4px; }

  .player-card{
    display:flex; align-items:center; gap:8px;
    background: var(--panel2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
  }
  .player-card img{ width:30px; height:30px; border-radius:50%; object-fit:cover; background:#222; }
  .player-card .pname{ font-size:13px; }
  .player-card .pscore{ font-size:11px; color:var(--dim); }

  /* tier colors */
  .t-Sp{ background:#ffd23f; } .t-S{ background:#ffc93f; } .t-Sm{ background:#ffbf3f; }
  .t-Ap{ background:#7cf29c; } .t-A{ background:#63e389; } .t-Am{ background:#4dd479; }
  .t-Bp{ background:#5ec8ff; } .t-B{ background:#4ab8f0; } .t-Bm{ background:#38a8e0; }
  .t-C{ background:#c9c9c9; } .t-D{ background:#ff9d5c; } .t-E{ background:#ff7b6b; } .t-F{ background:#ff5f5f; }

  .empty-msg{ text-align:center; color:var(--dim2); font-size:12.5px; padding:30px 0; }

  .tab-row{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    background: var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    cursor:pointer;
  }
  .tab-btn.active{ background: var(--accent); border-color:var(--accent); color:#fff; }

  /* モーダル */
  .modal-bg{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    align-items:center; justify-content:center; z-index:50;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    width:360px;
    max-width:90vw;
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal .sub{ font-size:12px; color:var(--dim); margin-bottom:14px; }
  .modal .item-line{
    display:flex; justify-content:space-between;
    padding:6px 0; border-top:1px solid var(--line); font-size:13px;
  }
  .modal .item-line:first-of-type{ border-top:none; }
  .modal .close{
    margin-top:16px; width:100%; padding:9px;
    background: var(--accent); border:none; border-radius:7px;
    color:#fff; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <img src="https://cdn.discordapp.com/embed/avatars/4.png" alt="">
  <div class="brand">&amp;LOLBEANS</div>
  <nav>
    <a href="./index.html">概要</a>
    <a href="./lolrank.html">評価する</a>
    <a href="./community.html">コース一覧</a>
  </nav>
</header>

<p class="lead">
  👑 ビーンズランク Tier List<br>
  総合(6項目合計)・攻撃性(狂暴)・調和力/献身度(優しさ)、3つの軸でTier分けするランキングです。<br>
  <a href="./lolrank.html">📊 あなたも評価する</a> ※3人以上から評価された人だけがランキングに表示されます(評価人数も併記)
</p>

<div class="wrap" style="margin-bottom:0; padding-bottom:0;">
  <div class="tab-row">
    <button class="tab-btn active" data-cat="overall">👑 総合ランキング</button>
    <button class="tab-btn" data-cat="violence">🐺 狂暴ランキング</button>
    <button class="tab-btn" data-cat="kindness">🕊️ 優しさランキング</button>
  </div>
</div>

<div class="wrap" id="tierWrap">
  <div class="empty-msg">読み込み中...</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalName"></h3>
    <div class="sub" id="modalSub"></div>
    <div id="modalRadar" style="display:flex; justify-content:center; margin:8px 0 4px;"></div>
    <div id="modalItems"></div>
    <button class="close" id="modalClose">閉じる</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collectionGroup, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJqqCzt_xppIt0lg3ItQfPwoR9uLWRWZI",
  authDomain: "lolex0204.firebaseapp.com",
  projectId: "lolex0204",
  storageBucket: "lolex0204.firebasestorage.app",
  messagingSenderId: "940620254622",
  appId: "1:940620254622:web:edca80d191423cd460da8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ITEM_DEFS = [
  { key:"aggression", name:"攻撃性" },
  { key:"chat", name:"雑談力" },
  { key:"madness", name:"狂気度" },
  { key:"devotion", name:"献身度" },
  { key:"influence", name:"影響力" },
  { key:"harmony", name:"調和力" },
];
const RANK_POINT = { S:5, A:4, B:3, C:2, D:1 };
const MIN_VOTES = 3;

// カテゴリ別ランキング定義: どの項目を合算するか
const CATEGORIES = {
  overall: { label:"総合ランキング", itemKeys:["aggression","chat","madness","devotion","influence","harmony"] },
  violence: { label:"狂暴ランキング", itemKeys:["aggression"] },
  kindness: { label:"優しさランキング", itemKeys:["harmony","devotion"] },
};
let currentCategory = "overall";

// tier定義: [ラベル, cssクラス, 最小スコアの割合(0〜1、満点に対する比率)]
const TIER_RATIOS = [
  ["S+","t-Sp",0.938], ["S","t-S",0.877], ["S-","t-Sm",0.815],
  ["A+","t-Ap",0.754], ["A","t-A",0.692], ["A-","t-Am",0.631],
  ["B+","t-Bp",0.569], ["B","t-B",0.508], ["B-","t-Bm",0.446],
  ["C","t-C",0.323], ["D","t-D",0.262], ["E","t-E",0.2], ["F","t-F",0],
];
function tierOf(score, maxScore){
  const ratio = maxScore > 0 ? score / maxScore : 0;
  for (const t of TIER_RATIOS){ if (ratio >= t[2]) return t; }
  return TIER_RATIOS[TIER_RATIOS.length-1];
}

async function loadPlayers(){
  const snap = await getDocs(collection(db, "players"));
  const map = {};
  snap.docs.forEach(d => { map[d.id] = { name: d.data().name || d.id, iconUrl: d.data().iconUrl || null }; });
  return map;
}

async function loadVotes(){
  // collectionGroup: すべての ratings/*/votes/* を横断取得
  const snap = await getDocs(collectionGroup(db, "votes"));
  const byTarget = {}; // targetId -> [voteData, ...]
  snap.forEach(d => {
    const targetId = d.ref.parent.parent.id;
    if (!byTarget[targetId]) byTarget[targetId] = [];
    byTarget[targetId].push(d.data());
  });
  return byTarget;
}

function aggregate(byTarget, playersMap){
  const results = [];
  for (const targetId of Object.keys(byTarget)){
    const votes = byTarget[targetId];
    const voteCount = votes.length;
    const itemAvg = {};
    ITEM_DEFS.forEach(item => {
      const pts = votes.map(v => RANK_POINT[v[item.key]]).filter(p => p !== undefined);
      itemAvg[item.key] = pts.length ? pts.reduce((a,b)=>a+b,0) / pts.length : 0;
    });
    const categoryScores = {};
    Object.keys(CATEGORIES).forEach(catId => {
      const keys = CATEGORIES[catId].itemKeys;
      categoryScores[catId] = keys.reduce((sum,k) => sum + itemAvg[k], 0);
    });
    const player = playersMap[targetId];
    const name = player ? player.name : (votes[0].targetName || targetId);
    const iconUrl = player ? player.iconUrl : null;
    results.push({ targetId, name, iconUrl, voteCount, itemAvg, categoryScores });
  }
  return results;
}

function renderTierList(results){
  const wrap = document.getElementById("tierWrap");
  const shown = results.filter(r => r.voteCount >= MIN_VOTES);

  if (shown.length === 0){
    wrap.innerHTML = `<div class="empty-msg">まだ${MIN_VOTES}人以上から評価されたプレイヤーがいません</div>`;
    return;
  }

  const cat = CATEGORIES[currentCategory];
  const maxScore = cat.itemKeys.length * 5;

  const grouped = {};
  TIER_RATIOS.forEach(t => grouped[t[0]] = []);
  shown.forEach(r => {
    const score = r.categoryScores[currentCategory];
    const t = tierOf(score, maxScore);
    grouped[t[0]].push({ ...r, score });
  });
  Object.values(grouped).forEach(list => list.sort((a,b) => b.score - a.score));

  wrap.innerHTML = TIER_RATIOS.map(t => {
    const [label, cls] = t;
    const list = grouped[label];
    return `
      <div class="tier-row">
        <div class="tier-label ${cls}">${label}</div>
        <div class="tier-cards">
          ${list.length === 0
            ? `<span class="tier-empty">まだ採点対象なし</span>`
            : list.map(r => `
                <div class="player-card" data-id="${r.targetId}">
                  <img src="${r.iconUrl || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(r.name)}`}" alt="">
                  <div>
                    <div class="pname">${r.name}</div>
                    <div class="pscore">${r.score.toFixed(1)} / ${maxScore}　${r.voteCount}人</div>
                  </div>
                </div>
              `).join("")
          }
        </div>
      </div>
    `;
  }).join("");

  // モーダル用にデータを保持
  window.__resultsById = {};
  shown.forEach(r => window.__resultsById[r.targetId] = r);

  [...wrap.querySelectorAll(".player-card")].forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.id));
  });
}

[...document.querySelectorAll(".tab-btn")].forEach(btn => {
  btn.addEventListener("click", () => {
    currentCategory = btn.dataset.cat;
    [...document.querySelectorAll(".tab-btn")].forEach(b => b.classList.toggle("active", b === btn));
    if (window.__allResults) renderTierList(window.__allResults);
  });
});

function buildRadarSVG(itemAvg){
  const size = 260;
  const cx = size/2, cy = size/2;
  const radius = 92;
  const maxVal = 5;
  const n = ITEM_DEFS.length;
  const angleFor = (i) => (Math.PI * 2 * i / n) - Math.PI/2;

  const pointAt = (i, val) => {
    const r = (val / maxVal) * radius;
    const a = angleFor(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };

  // グリッド(3段階の同心多角形)
  let gridPolys = "";
  [0.33, 0.66, 1.0].forEach(frac => {
    const pts = ITEM_DEFS.map((_, i) => pointAt(i, maxVal*frac).join(",")).join(" ");
    gridPolys += `<polygon points="${pts}" fill="none" stroke="#1c2230" stroke-width="1"/>`;
  });

  // 軸線
  let axisLines = "";
  ITEM_DEFS.forEach((_, i) => {
    const [x,y] = pointAt(i, maxVal);
    axisLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2230" stroke-width="1"/>`;
  });

  // データポリゴン
  const dataPts = ITEM_DEFS.map((item, i) => pointAt(i, itemAvg[item.key]).join(",")).join(" ");

  // ラベル
  let labels = "";
  ITEM_DEFS.forEach((item, i) => {
    const [x,y] = pointAt(i, maxVal * 1.22);
    labels += `<text x="${x}" y="${y}" fill="#7a8499" font-size="11" text-anchor="middle" dominant-baseline="middle">${item.name}</text>`;
  });

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${gridPolys}
      ${axisLines}
      <polygon points="${dataPts}" fill="rgba(88,101,242,0.35)" stroke="#5865F2" stroke-width="2"/>
      ${labels}
    </svg>
  `;
}

function openModal(id){
  const r = window.__resultsById[id];
  if (!r) return;
  const cat = CATEGORIES[currentCategory];
  document.getElementById("modalName").textContent = r.name;
  document.getElementById("modalSub").textContent =
    `${cat.label}: ${r.categoryScores[currentCategory].toFixed(1)} / ${cat.itemKeys.length*5}　評価人数 ${r.voteCount}人`;
  document.getElementById("modalRadar").innerHTML = buildRadarSVG(r.itemAvg);
  document.getElementById("modalItems").innerHTML = ITEM_DEFS.map(item => `
    <div class="item-line" style="${cat.itemKeys.includes(item.key) ? 'font-weight:700;' : 'color:var(--dim);'}">
      <span>${item.name}${cat.itemKeys.includes(item.key) ? " ★" : ""}</span><span>${r.itemAvg[item.key].toFixed(1)}</span>
    </div>
  `).join("");
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("modalBg").classList.remove("show");
});
document.getElementById("modalBg").addEventListener("click", (e) => {
  if (e.target.id === "modalBg") document.getElementById("modalBg").classList.remove("show");
});

async function init(){
  try {
    const [playersMap, byTarget] = await Promise.all([loadPlayers(), loadVotes()]);
    const results = aggregate(byTarget, playersMap);
    window.__allResults = results;
    renderTierList(results);
  } catch(e){
    console.error(e);
    document.getElementById("tierWrap").innerHTML =
      `<div class="empty-msg">ランキングの読み込みに失敗しました</div>`;
  }
}
init();
</script>
</body>
</html>
