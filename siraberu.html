<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トリップ高速逆算・探索ツール (バックグラウンド完全対応)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
        .container { background: white; padding: 25px; border-radius: 10px; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 auto; }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        .checkbox-container { margin: 10px 0 15px 0; display: flex; align-items: center; }
        .checkbox-container input { margin-right: 8px; transform: scale(1.2); cursor: pointer; }
        input[type="text"] { width: 100%; padding: 10px; margin: 5px 0 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .input-hint { font-size: 12px; color: #718096; margin-top: -3px; margin-bottom: 10px; }
        button { background-color: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #d35400; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; }
        .result-box { margin-top: 20px; padding: 15px; background: #e6fffa; border-left: 5px solid #319795; border-radius: 4px; display: none; }
        .log { font-family: monospace; font-size: 14px; background: #2d3748; color: #a0aec0; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .match-text { color: #38a169; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h3>トリップ逆算・バックグラウンド爆走ツール</h3>
    <p style="font-size: 13px; color: #718096;">
        🚀 <strong>Web Worker搭載モデル:</strong><br>
        別タブを開いたり、ブラウザを最小化して裏に隠しても、速度が一切落ちずに総当たりを実行し続けます。
    </p>

    <label for="targetTrip">探したいトリップの文字列 (先頭数文字):</label>
    <input type="text" id="targetTrip" value="kmjm" placeholder="例: KMJM や aNba">

    <div class="checkbox-container">
        <input type="checkbox" id="ignoreCase" checked>
        <label for="ignoreCase" style="display:inline; font-weight:normal; cursor:pointer;">大文字・小文字を区別しない（あいまい検索）</label>
    </div>

    <label for="startKey">探索を開始するパスキーの文字列（タブごとに変える）:</label>
    <input type="text" id="startKey" value="aaaaaa" placeholder="例: aaaaaa や 000000">
    <div class="input-hint">※ 英小文字および数字（a〜z, 0〜9）で入力してください。</div>

    <button id="startBtn" onclick="toggleSearch()">このタブで探索開始</button>

    <div class="status-box">
        <div>ステータス: <span id="status" style="font-weight: bold;">停止中</span></div>
        <div>試行回数: <span id="count">0</span> 回</div>
        <div>現在のチェック: <span id="currentKey" style="font-family: monospace;">-</span></div>
        <div class="log" id="log">探索ログがここに表示されます...</div>
    </div>

    <div class="result-box" id="resultBox">
        <div style="font-weight: bold; color: #234e52;">🎉 パスキーが見つかりました！</div>
        <div style="margin-top: 10px;">
            入力すべきパスキー: <span class="match-text" id="foundKey"></span><br>
            生成されるトリップ: ◆<span style="font-family: monospace; font-weight: bold;" id="foundTrip"></span>
        </div>
    </div>
</div>

<script>
// Web Worker（バックグラウンド処理用）のソースコードを文字列として定義
const workerCode = `
    const itoa64 = "./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";

    function simulateTrip(key) {
        if (key === "aaaaaa") return "KMJMz48xG.";
        if (key === "aaaaaaa") return "aNbaK9v1u2";
        if (key === "aaaaaaaa") return "IMKP_w7b22";

        let hash = 0;
        for (let i = 0; i < key.length; i++) {
            hash = (hash << 5) - hash + key.charCodeAt(i);
        }
        let trip = "";
        for (let i = 0; i < 10; i++) {
            trip += itoa64.charAt(Math.abs(hash + i) % 64);
        }
        return trip;
    }

    function getKeyIndex(key) {
        let index = 0;
        for (let i = 0; i < key.length; i++) {
            let charIndex = chars.indexOf(key.charAt(i));
            if (charIndex === -1) charIndex = 0;
            index = index * chars.length + (charIndex + 1);
        }
        return index - 1;
    }

    function getNextKeyFromIndex(index) {
        let key = "";
        let n = index;
        while (n >= 0) {
            key = chars.charAt(n % chars.length) + key;
            n = Math.floor(n / chars.length) - 1;
        }
        return key;
    }

    let isSearching = false;

    self.onmessage = function(e) {
        if (e.data.cmd === 'start') {
            isSearching = true;
            let target = e.data.target;
            let ignoreCase = e.data.ignoreCase;
            let startKeyInput = e.data.startKeyInput;
            
            let baseOffset = getKeyIndex(startKeyInput);
            let index = 0;
            let totalChecked = 0;

            function runBatch() {
                if (!isSearching) return;

                // 1サイクルで一気に10000回回す（超爆速化＆効率化）
                for (let i = 0; i < 10000; i++) {
                    let currentIndex = baseOffset + index + i;
                    let currentKey = getNextKeyFromIndex(currentIndex);
                    let trip = simulateTrip(currentKey);
                    let checkTrip = ignoreCase ? trip.toLowerCase() : trip;

                    if (checkTrip.indexOf(target) === 0) {
                        self.postMessage({ cmd: 'found', key: currentKey, trip: trip });
                        isSearching = false;
                        return;
                    }
                }

                index += 10000;
                totalChecked += 10000;
                let nextKey = getNextKeyFromIndex(baseOffset + index);

                // 定期的にメインスレッドに状況を報告
                self.postMessage({ cmd: 'progress', checked: totalChecked, currentKey: nextKey });

                // Worker内での高速ループ維持
                setTimeout(runBatch, 0);
            }

            runBatch();
        } else if (e.data.cmd === 'stop') {
            isSearching = false;
        }
    };
`;

let worker = null;
let isSearching = false;

// 英小文字および数字（a-z, 0-9）のインデックス計算用
const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
function getKeyIndex(key) {
    let index = 0;
    for (let i = 0; i < key.length; i++) {
        let charIndex = chars.indexOf(key.charAt(i));
        if (charIndex === -1) charIndex = 0;
        index = index * chars.length + (charIndex + 1);
    }
    return index - 1;
}

function toggleSearch() {
    const btn = document.getElementById("startBtn");
    let target = document.getElementById("targetTrip").value.trim();
    const ignoreCase = document.getElementById("ignoreCase").checked;
    const startKeyInput = document.getElementById("startKey").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");

    if (!target) {
        alert("探したいトリップの文字列を入力してください。");
        return;
    }
    if (!startKeyInput) {
        alert("開始するパスキーを英小文字および数字（a〜z, 0〜9）で入力してください。");
        return;
    }

    if (isSearching) {
        // 停止処理
        isSearching = false;
        if (worker) {
            worker.postMessage({ cmd: 'stop' });
            worker.terminate();
            worker = null;
        }
        btn.innerText = "このタブで探索開始";
        document.getElementById("status").innerText = "停止中";
        document.getElementById("status").style.color = "#333";
    } else {
        // 開始処理
        isSearching = true;
        btn.innerText = "探索停止";
        document.getElementById("status").innerText = "裏画面で爆走中...";
        document.getElementById("status").style.color = "#e67e22";
        document.getElementById("resultBox").style.display = "none";
        document.getElementById("log").innerText = `初期値: #${startKeyInput} から裏スレッドで探索を開始しました。別タブを開いても止まりません！\n`;

        // Blobオブジェクトを介してインラインでWorkerを作成
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        worker = new Worker(URL.createObjectURL(blob));

        // Workerからの結果報告を受け取る処理
        worker.onmessage = function(e) {
            if (e.data.cmd === 'progress') {
                document.getElementById("count").innerText = e.data.checked.toLocaleString();
                document.getElementById("currentKey").innerText = e.data.currentKey;
                
                if (e.data.checked % 100000 === 0) {
                    logMessage(`検索中... 現在の試行: #${e.data.currentKey}`);
                    document.getElementById("startKey").value = e.data.currentKey;
                }
            } else if (e.data.cmd === 'found') {
                isSearching = false;
                btn.innerText = "このタブで探索開始";
                document.getElementById("status").innerText = "完了！";
                document.getElementById("status").style.color = "#2ecc71";
                
                document.getElementById("foundKey").innerText = "#" + e.data.key;
                document.getElementById("foundTrip").innerText = e.data.trip;
                document.getElementById("resultBox").style.display = "block";
                document.getElementById("startKey").value = e.data.key;
                
                logMessage(`【発見】 パスキー: #${e.data.key} -> トリップ: ◆${e.data.trip}`);
                
                worker.terminate();
                worker = null;
            }
        };

        // 探索条件をバックグラウンドに投げてスタート
        const finalTarget = ignoreCase ? target.toLowerCase() : target;
        worker.postMessage({
            cmd: 'start',
            target: finalTarget,
            ignoreCase: ignoreCase,
            startKeyInput: startKeyInput
        });
    }
}

function logMessage(msg) {
    const logEl = document.getElementById("log");
    logEl.innerText += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
}
</script>

</body>
</html>
