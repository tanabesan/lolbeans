<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

/* ── TOKENS (コース一覧と統一) ── */
:root{
  --bg:#000408;--bg2:#010c0f;--panel:#001a1f;--card:#001014;
  --edge:#002830;--line:#004050;--line2:#006070;
  --t0:#e0fff8;--t1:#80c8be;--t2:#3a7870;--t3:#1a4840;
  --acc:#00ff41;--acc2:#ff2d55;--acc3:#00d4ff;--acc4:#ffcc00;
  --glow-g:0 0 8px #00ff41,0 0 20px rgba(0,255,65,.4);
  --glow-b:0 0 8px #00d4ff,0 0 20px rgba(0,212,255,.4);
  --glow-r:0 0 8px #ff2d55,0 0 20px rgba(255,45,85,.4);
  --ff:'Share Tech Mono',monospace;
  --ffj:'M PLUS Rounded 1c',sans-serif;
  --ffh:'Press Start 2P',cursive;
}

body{font-family:var(--ff);background:var(--bg);color:var(--t0);min-height:100vh;overflow-x:hidden}
body.jp{font-family:var(--ffj)}

/* ── CRT SCANLINES ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
}

/* ── BG ── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
  background-image:linear-gradient(rgba(0,212,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.15) 1px,transparent 1px);
  background-size:32px 32px}
.bg-corner-tl,.bg-corner-tr,.bg-corner-bl,.bg-corner-br{position:fixed;width:120px;height:120px;pointer-events:none;z-index:0;opacity:.4}
.bg-corner-tl{top:0;left:0;border-top:2px solid var(--acc3);border-left:2px solid var(--acc3)}
.bg-corner-tr{top:0;right:0;border-top:2px solid var(--acc3);border-right:2px solid var(--acc3)}
.bg-corner-bl{bottom:0;left:0;border-bottom:2px solid var(--acc3);border-left:2px solid var(--acc3)}
.bg-corner-br{bottom:0;right:0;border-bottom:2px solid var(--acc3);border-right:2px solid var(--acc3)}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;animation:ptFloat var(--dur) linear infinite var(--del);opacity:0}
@keyframes ptFloat{0%{opacity:0;transform:translateY(0)}10%{opacity:1}90%{opacity:.6}100%{opacity:0;transform:translateY(-100vh)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── HEADER ── */
header{position:relative;z-index:10;text-align:center;padding:52px 16px 32px}
.logo-line{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.logo-icon{font-size:2rem;display:inline-block;animation:iconBob 2s ease-in-out infinite}
.logo-icon:nth-child(3){animation-delay:-.7s;animation-direction:alternate-reverse}
@keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-text{
  font-family:var(--ffh);font-size:clamp(.9rem,3.5vw,1.6rem);
  color:var(--acc3);text-shadow:var(--glow-b);letter-spacing:.06em;
}
.logo-sub{
  font-family:var(--ffh);font-size:clamp(.5rem,2vw,.75rem);
  color:var(--acc);letter-spacing:.12em;text-shadow:var(--glow-g);
  margin-top:6px;
}
.logo-sub::after{content:'_';animation:blink .8s step-end infinite}
.logo-deco{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.logo-deco-line{width:80px;height:2px;background:var(--acc3);box-shadow:var(--glow-b);
  clip-path:polygon(0 0,100% 0,100% 50%,calc(100% - 4px) 50%,calc(100% - 4px) 100%,4px 100%,4px 50%,0 50%)}
.logo-deco span{color:var(--acc3);font-family:var(--ffh);font-size:.5rem}

/* ── STATS ── */
.stats-bar{position:relative;z-index:10;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:.4rem 1rem 1.8rem}
.s-pill{
  background:var(--panel);border:2px solid var(--line2);
  box-shadow:2px 2px 0 var(--edge);
  padding:7px 14px;font-size:.7rem;font-weight:700;color:var(--t2);
  display:flex;align-items:center;gap:8px;font-family:var(--ff);
}
.s-pill .v{color:var(--acc);font-family:var(--ffh);font-size:.65rem;text-shadow:var(--glow-g)}
.s-pill .ms{font-size:1rem;color:var(--acc3)}

/* ── RANK LEGEND ── */
.rank-legend-wrap{position:relative;z-index:10;max-width:100%;margin:0 auto 1.8rem;padding:0 1rem}
.rl-head{
  font-family:var(--ffh);font-size:.48rem;letter-spacing:.1em;
  color:var(--acc3);text-align:center;text-transform:uppercase;
  text-shadow:var(--glow-b);margin-bottom:12px;
}
.rank-legend{
  display:flex;justify-content:center;flex-wrap:nowrap;gap:6px;
  overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.rank-legend::-webkit-scrollbar{height:3px}
.rank-legend::-webkit-scrollbar-thumb{background:var(--line2)}
.rl-item{
  display:flex;align-items:center;gap:6px;
  background:var(--card);border:2px solid var(--line2);
  box-shadow:2px 2px 0 var(--edge);
  padding:6px 10px 6px 6px;cursor:default;
  transition:transform .15s,box-shadow .15s;flex-shrink:0;
}
.rl-item:hover{transform:translate(-1px,-2px);box-shadow:3px 3px 0 var(--acc3),var(--glow-b)}
.rl-icon{height:40px;width:auto;flex-shrink:0;object-fit:contain}
.rl-name{display:block;font-family:var(--ffh);font-size:.5rem;font-weight:800}
.rl-pts{display:block;font-size:.6rem;opacity:.5;font-weight:700;margin-top:2px}
.pname-link{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.25);transition:all .2s}
.pname-link:hover{border-bottom-color:currentColor;opacity:.85}

/* ── CONTROLS ── */
.controls{position:relative;z-index:10;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:0 1rem 1.8rem}
.sbox{position:relative}
.sbox input{
  background:var(--bg);border:2px solid var(--line2);
  padding:8px 12px 8px 36px;color:var(--t0);font-family:var(--ff);
  font-size:.82rem;font-weight:700;width:200px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.sbox input:focus{border-color:var(--acc3);box-shadow:var(--glow-b)}
.sbox input::placeholder{color:var(--t3)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:.85rem;pointer-events:none}
.cbtn{
  background:var(--panel);border:2px solid var(--line2);box-shadow:2px 2px 0 var(--edge);
  padding:8px 14px;color:var(--t2);font-family:var(--ffh);font-size:.45rem;
  font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.04em;
}
.cbtn:hover,.cbtn.on{border-color:var(--acc4);color:var(--acc4);box-shadow:2px 2px 0 rgba(255,204,0,.4),0 0 8px rgba(255,204,0,.2)}
.rbtn{
  background:var(--acc2);border:2px solid var(--acc2);
  padding:8px 16px;color:#fff;font-family:var(--ffh);font-size:.45rem;
  font-weight:900;cursor:pointer;box-shadow:4px 4px 0 rgba(255,45,85,.5);
  transition:all .15s;letter-spacing:.04em;
}
.rbtn:hover{background:transparent;color:var(--acc2);box-shadow:var(--glow-r),4px 4px 0 var(--acc2)}
.rbtn.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── PT LEGEND ── */
.pt-legend{position:relative;z-index:10;max-width:880px;margin:0 auto 2rem;padding:0 1rem;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.ptl{
  display:flex;align-items:center;gap:5px;
  background:var(--card);border:1px solid var(--line2);
  padding:4px 10px;font-size:.65rem;font-weight:700;color:var(--t2);
}
.ptd{width:8px;height:8px;flex-shrink:0}

/* ── TABLE ── */
.tw{position:relative;z-index:10;max-width:980px;margin:0 auto;padding:0 1rem 5rem}
.slbl{
  font-family:var(--ffh);font-size:.48rem;letter-spacing:.1em;
  color:var(--acc3);text-transform:uppercase;text-align:center;
  margin-bottom:14px;text-shadow:var(--glow-b);
}
.rt{width:100%;border-collapse:separate;border-spacing:0 6px}
.rt thead th{
  font-family:var(--ffh);font-size:.45rem;letter-spacing:.1em;
  color:var(--t2);text-transform:uppercase;padding:6px 10px;text-align:left;
}
.rt thead th.c{text-align:center}

/* ROW */
.rrow{
  background:var(--card);border:2px solid var(--line2);
  box-shadow:3px 3px 0 var(--edge);
  transition:transform .15s,box-shadow .15s,border-color .15s;
  animation:rIn .3s ease-out both;cursor:pointer;
}
@keyframes rIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.rrow:hover{transform:translate(-2px,-3px);border-color:var(--acc3);box-shadow:5px 5px 0 var(--acc3),var(--glow-b)}
.rrow td{padding:10px 10px;vertical-align:middle}
.rrow td:first-child{text-align:center;width:48px}
.top1{border-left:4px solid #ffd700;box-shadow:3px 3px 0 rgba(255,215,0,.4)}
.top2{border-left:4px solid #c8c8d4;box-shadow:3px 3px 0 rgba(200,200,212,.3)}
.top3{border-left:4px solid #e8874a;box-shadow:3px 3px 0 rgba(232,135,74,.35)}
.top1:hover{border-color:#ffd700;box-shadow:5px 5px 0 #ffd700,0 0 14px rgba(255,215,0,.4)}
.top2:hover{border-color:#c8c8d4;box-shadow:5px 5px 0 #c8c8d4}
.top3:hover{border-color:#e8874a;box-shadow:5px 5px 0 #e8874a}

.rnum{font-family:var(--ffh);font-size:.75rem;color:var(--t3);display:inline-block;min-width:28px;text-align:center}
.top1 .rnum{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6)}
.top2 .rnum{color:#c8c8d4}
.top3 .rnum{color:#e8874a}

.pcell{display:flex;align-items:center;gap:10px}
.shw{width:44px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.shi{width:auto;height:52px;object-fit:contain;transition:transform .2s,filter .2s;filter:drop-shadow(0 3px 7px var(--sg,rgba(0,0,0,.5)))}
.rrow:hover .shi{transform:scale(1.15) rotate(-4deg);filter:drop-shadow(0 4px 12px var(--sg,rgba(0,0,0,.5))) brightness(1.1)}
.pname{font-family:var(--ffh);font-size:.6rem;line-height:1.4;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.top1 .pname{color:#ffe066}.top2 .pname{color:#dde}.top3 .pname{color:#e8874a}.topN .pname{color:var(--t0)}
.prank-lbl{font-family:var(--ffh);font-size:.42rem;font-weight:800;padding:2px 6px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px;display:inline-block}
.subtier{display:flex;gap:3px;margin-top:5px;align-items:center}
.stpip{width:7px;height:7px;transition:transform .15s}
.stpip.filled{box-shadow:0 0 4px var(--pc)}
.stpip.empty{opacity:.2}
.ms{font-family:'Material Symbols Rounded';font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

.cats{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--ffh);font-size:.42rem;font-weight:800;padding:2px 6px;white-space:nowrap}
.c1000{background:rgba(255,80,110,.15);color:#ff5070;border:1px solid rgba(255,80,110,.28)}
.c750{background:rgba(255,205,50,.13);color:#ffc832;border:1px solid rgba(255,205,50,.28)}
.c500{background:rgba(50,220,240,.1);color:#32dce8;border:1px solid rgba(50,220,240,.22)}
.c100{background:rgba(165,100,255,.13);color:#a564ff;border:1px solid rgba(165,100,255,.28)}
.cu100{background:rgba(60,230,140,.1);color:#3ce68c;border:1px solid rgba(60,230,140,.22)}

.wrc{font-family:var(--ffh);font-size:.9rem;color:var(--acc3);text-align:center;text-shadow:var(--glow-b)}
.ptv{font-family:var(--ffh);font-size:1rem;text-align:center;font-weight:900}
.top1 .ptv{color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.5)}
.top2 .ptv{color:#c8c8d4}
.top3 .ptv{color:#e8874a}

/* ── STATE / PAGER / TOAST ── */
.smsg{text-align:center;padding:5rem 2rem;color:var(--t2);font-size:.8rem;font-weight:700;font-family:var(--ffh);letter-spacing:.06em}
.smsg .big{font-size:2.5rem;display:block;margin-bottom:1rem}

.pager{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:1.5rem;flex-wrap:wrap}
.pgb{
  background:var(--panel);border:2px solid var(--line2);
  box-shadow:2px 2px 0 var(--edge);
  width:36px;height:36px;color:var(--t2);
  font-family:var(--ffh);font-weight:700;font-size:.5rem;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.pgb:hover{border-color:var(--acc4);color:var(--acc4);box-shadow:2px 2px 0 rgba(255,204,0,.4)}
.pgb.on{background:var(--acc4);border-color:var(--acc4);color:var(--bg);box-shadow:2px 2px 0 rgba(255,204,0,.5)}
.pgb:disabled{opacity:.25;cursor:not-allowed}

#toast{
  position:fixed;bottom:2rem;right:1.5rem;
  background:var(--panel);border:2px solid var(--acc3);
  box-shadow:4px 4px 0 var(--acc3),var(--glow-b);
  padding:10px 16px;color:var(--t0);font-family:var(--ffh);font-size:.5rem;
  z-index:9999;transform:translateY(70px);opacity:0;
  transition:all .35s cubic-bezier(.175,.885,.32,1.275);max-width:260px;letter-spacing:.04em;
}
#toast.show{transform:translateY(0);opacity:1}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,4,8,.88);
  backdrop-filter:blur(4px);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--panel);border:2px solid var(--acc3);
  box-shadow:8px 8px 0 var(--acc3),var(--glow-b);
  width:100%;max-width:480px;padding:24px 22px;position:relative;
  transform:translateY(20px) scale(.96);transition:transform .28s cubic-bezier(.175,.885,.32,1.275);
  max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:none}
.modal-close{
  position:absolute;top:10px;right:10px;
  background:rgba(0,4,8,.6);border:2px solid var(--acc2);color:var(--acc2);
  width:32px;height:32px;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  box-shadow:2px 2px 0 var(--acc2);
}
.modal-close:hover{background:var(--acc2);color:#fff;box-shadow:var(--glow-r)}

/* modal header */
.mh{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--line2)}
.mh-shield{height:72px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 14px var(--mg,rgba(0,0,0,.5)))}
.mh-name{font-family:var(--ffh);font-size:clamp(.65rem,2.5vw,.9rem);line-height:1.4}
.mh-rank{font-family:var(--ffh);font-size:.42rem;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px;display:inline-block}

/* rank position bar */
.rank-pos-wrap{margin-bottom:16px}
.rp-label{font-family:var(--ffh);font-size:.45rem;font-weight:800;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.rp-bar-bg{background:var(--edge);border:1px solid var(--line2);height:12px;overflow:visible;position:relative;margin-bottom:20px}
.rp-bar-track{position:absolute;inset:0;overflow:hidden}
.rp-bar-fill{height:12px;transition:width .8s cubic-bezier(.22,1,.36,1);position:relative;min-width:4px}
.rp-bar-fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 6px,rgba(0,0,0,.2) 6px,rgba(0,0,0,.2) 7px)}
.rp-div{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.5);z-index:2}
.rp-tip{position:absolute;top:-26px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--tipcolor,#fff);padding:2px 6px;font-family:var(--ffh);font-size:.42rem;font-weight:800;color:var(--t0);white-space:nowrap;transition:left .8s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:10}
.rp-tip::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:3px solid transparent;border-top-color:var(--tipcolor,#fff)}
.rp-seg-labels{display:flex;margin-top:4px}
.rp-seg-lbl{flex:1;font-size:.5rem;font-weight:800;color:var(--t3);text-align:center;letter-spacing:.02em}
.rp-pct{font-family:var(--ffh);font-size:.48rem;color:var(--t1);margin-top:4px;text-align:right}

/* sub-tier */
.stier-wrap{margin-bottom:16px}
.stier-title{font-family:var(--ffh);font-size:.45rem;font-weight:800;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.stier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stier-card{background:var(--edge);border:1px solid var(--line2);padding:8px 6px;text-align:center;transition:border-color .2s}
.stier-card.current{border-color:var(--pc,#fff);box-shadow:2px 2px 0 var(--pc,#fff)}
.stier-card-name{font-family:var(--ffh);font-size:.5rem;letter-spacing:.03em}
.stier-card-range{font-size:.55rem;opacity:.5;margin-top:2px}
.stier-card-you{font-family:var(--ffh);font-size:.42rem;font-weight:800;margin-top:4px;color:var(--acc)}

/* stats grid */
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.mstat{background:var(--edge);border:1px solid var(--line2);border-left:3px solid var(--acc3);padding:10px 12px}
.mstat-lbl{font-family:var(--ffh);font-size:.42rem;font-weight:800;color:var(--t2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.mstat-val{font-family:var(--ffh);font-size:1rem}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}

/* calc section */
.calc-wrap{background:var(--edge);border:1px solid var(--line2);overflow:hidden;margin-bottom:14px}
.calc-summary{padding:10px 14px;font-family:var(--ffh);font-size:.45rem;font-weight:800;color:var(--t1);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;user-select:none;letter-spacing:.04em}
.calc-summary::-webkit-details-marker{display:none}
.calc-summary::after{content:'▶';margin-left:auto;font-size:.55rem;color:var(--t3);transition:transform .2s}
details[open] .calc-summary::after{transform:rotate(90deg)}
.calc-body{padding:4px 14px 14px;border-top:1px solid var(--line2)}

.pt-acc-dot{width:9px;height:9px;flex-shrink:0}

/* ── 省エネモード ── */
body.eco{--ff:system-ui,-apple-system,sans-serif;--ffh:system-ui,-apple-system,sans-serif;--ffj:system-ui,-apple-system,sans-serif}

}

<script>
const GAS='https://script.google.com/macros/s/AKfycbxdO6Xv8VFLkjc5vrX1hy3u4DQWEP28Ht8sX8Rc1kKb9sGBap0RdqAF1TXHPEBrIAA8vA/exec';
const PG=30;
let all=[],fil=[],sort='pts',pg=1,lang='jp';
let ecoMode=localStorage.getItem('ecoMode')==='1';

/* ── 省エネ ── */
function applyEco(on){

}
if(ecoMode)applyEco(true);

/* ── i18n ── */

}

/* ── RANKS ── */
const RANKS=[
  {id:'gm',jp:'グランドマスター',en:'Grand Master',minPts:150,maxPts:Infinity,col:'#ff2d55',bg:'#1a000a',b1:'#ff2d55',b2:'#ff8c00',b3:'#ffd700',glow:'rgba(255,45,85,.8)',icon:'crown',subs:[{jp:'I',en:'I',min:150},{jp:'II',en:'II',min:175},{jp:'III',en:'III',min:200}]},
  {id:'mst',jp:'マスター',en:'Master',minPts:75,maxPts:149,col:'#d946ef',bg:'#150020',b1:'#7c3aed',b2:'#c026d3',b3:'#e879f9',glow:'rgba(192,38,211,.75)',icon:'gem',subs:[{jp:'I',en:'I',min:75},{jp:'II',en:'II',min:95},{jp:'III',en:'III',min:120}]},
  {id:'dia',jp:'ダイヤモンド',en:'Diamond',minPts:30,maxPts:74,col:'#22d3ee',bg:'#001520',b1:'#0891b2',b2:'#06b6d4',b3:'#67e8f9',glow:'rgba(6,182,212,.7)',icon:'diamond',subs:[{jp:'I',en:'I',min:30},{jp:'II',en:'II',min:42},{jp:'III',en:'III',min:55}]},
  {id:'plat',jp:'プラチナ',en:'Platinum',minPts:10,maxPts:29,col:'#34d399',bg:'#001a10',b1:'#059669',b2:'#10b981',b3:'#6ee7b7',glow:'rgba(16,185,129,.65)',icon:'star6',subs:[{jp:'I',en:'I',min:10},{jp:'II',en:'II',min:16},{jp:'III',en:'III',min:22}]},
  {id:'gold',jp:'ゴールド',en:'Gold',minPts:5,maxPts:9,col:'#fbbf24',bg:'#1a0e00',b1:'#b45309',b2:'#d97706',b3:'#fde68a',glow:'rgba(251,191,36,.7)',icon:'star5',subs:[{jp:'I',en:'I',min:5},{jp:'II',en:'II',min:6},{jp:'III',en:'III',min:8}]},
  {id:'sil',jp:'シルバー',en:'Silver',minPts:2,maxPts:4,col:'#94a3b8',bg:'#0e1018',b1:'#475569',b2:'#64748b',b3:'#cbd5e1',glow:'rgba(100,116,139,.6)',icon:'shield',subs:[{jp:'I',en:'I',min:2},{jp:'II',en:'II',min:3},{jp:'III',en:'III',min:4}]},
  {id:'brz',jp:'ブロンズ',en:'Bronze',minPts:0,maxPts:1,col:'#fb923c',bg:'#1a0800',b1:'#9a3412',b2:'#ea580c',b3:'#fed7aa',glow:'rgba(234,88,12,.6)',icon:'bean',subs:[{jp:'I',en:'I',min:0},{jp:'II',en:'II',min:1},{jp:'III',en:'III',min:1}]},
];
const getRank=p=>RANKS.find(r=>p>=r.minPts)||RANKS[6];
function getSubTier(rk,pts){let r=0;for(let i=0;i<rk.subs.length;i++){if(pts>=rk.subs[i].min)r=i;}return r;}

/* ── SHIELD SVG (元のコードをそのまま流用) ── */
function mkShield(r,sz=44,subIdx=null){
  const id=`${r.id}_${Math.random().toString(36).slice(2,7)}`;
  const icons={
    crown:`<g transform="translate(22,19)"><path d="M-9,7 L-9,-1 L-5.5,3 L0,-7 L5.5,3 L9,-1 L9,7 Z" fill="${r.b3}" stroke="${r.b1}" stroke-width="1.2" stroke-linejoin="round"/><rect x="-9" y="7" width="18" height="4" rx="2" fill="${r.b3}" stroke="${r.b1}" stroke-width="1"/><circle cx="-9" cy="-1" r="2" fill="${r.b2}"/><circle cx="0" cy="-7" r="2.4" fill="${r.b2}"/><circle cx="9" cy="-1" r="2" fill="${r.b2}"/><rect x="-6" y="8.2" width="12" height="1.4" rx=".7" fill="white" opacity=".3"/></g>`,
    gem:`<g transform="translate(22,20)"><polygon points="0,-10 7,-3 7,4 0,9 -7,4 -7,-3" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.5" stroke-linejoin="round"/><polygon points="0,-6 4,-2 4,2 0,5 -4,2 -4,-2" fill="${r.b3}" opacity=".55"/><polygon points="-7,-3 0,-10 7,-3" fill="${r.b3}" opacity=".4"/><line x1="-7" y1="-3" x2="7" y2="-3" stroke="white" stroke-width=".7" opacity=".25"/></g>`,
    diamond:`<g transform="translate(22,20)"><polygon points="0,-11 8,0 0,11 -8,0" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.5" stroke-linejoin="round"/><polygon points="0,-6 5,0 0,6 -5,0" fill="${r.b3}" opacity=".5"/><polygon points="0,-11 8,0 0,-3 -8,0" fill="${r.b3}" opacity=".4"/><polygon points="0,-2.5 3,0 0,2.5 -3,0" fill="white" opacity=".55"/></g>`,
    star6:`<g transform="translate(22,20)"><polygon points="0,-10 2.6,-3.5 9,-3.5 4,1 6,8 0,4.5 -6,8 -4,1 -9,-3.5 -2.6,-3.5" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.3" stroke-linejoin="round"/><polygon points="0,-6 1.6,-2.1 5.5,-2.1 2.4,0.6 3.6,4.8 0,2.7 -3.6,4.8 -2.4,0.6 -5.5,-2.1 -1.6,-2.1" fill="${r.b3}" opacity=".55"/><circle cx="0" cy="0" r="2.2" fill="white" opacity=".5"/></g>`,
    star5:`<g transform="translate(22,20)"><polygon points="0,-11 3.2,-3.8 11,-3.5 5.2,1.5 7.2,9.5 0,5.5 -7.2,9.5 -5.2,1.5 -11,-3.5 -3.2,-3.8" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.3" stroke-linejoin="round"/><polygon points="0,-7 2,-2.4 7,-2.2 3.2,1 4.5,6 0,3.5 -4.5,6 -3.2,1 -7,-2.2 -2,-2.4" fill="${r.b3}" opacity=".5"/><circle cx="0" cy="1" r="2" fill="white" opacity=".45"/></g>`,
    shield:`<g transform="translate(22,20)"><path d="M0,-10 L8,-6 L8,2 Q8,9 0,12 Q-8,9 -8,2 L-8,-6 Z" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.4" stroke-linejoin="round"/><path d="M0,-6 L5,-3 L5,2 Q5,6.5 0,8.5 Q-5,6.5 -5,2 L-5,-3 Z" fill="${r.b3}" opacity=".4"/><line x1="-5" y1="-1" x2="5" y2="-1" stroke="${r.b3}" stroke-width="1" opacity=".5"/><line x1="0" y1="-6" x2="0" y2="8" stroke="${r.b3}" stroke-width=".8" opacity=".35"/></g>`,
    bean:`<g transform="translate(22,20)"><ellipse cx="0" cy="0" rx="7" ry="9.5" fill="${r.b2}" stroke="${r.b3}" stroke-width="1.4"/><path d="M-3,-8 Q7,-2 2,8" stroke="${r.b3}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/><ellipse cx="0" cy="0" rx="4" ry="5.5" fill="${r.b3}" opacity=".35"/></g>`,
  };
  const si=subIdx===null?2:subIdx;
  const cx=22,cy=25;
  let deco='';
  if(r.id==='brz'){
    if(si>=1){deco+=`<path d="M22,2 L40,9 L40,24 Q40,38 22,48 Q4,38 4,24 L4,9 Z" fill="none" stroke="${r.b3}" stroke-width="${si===1?1.2:2}" stroke-linejoin="round" opacity="${si===1?0.25:0.4}"/>`;}
    if(si>=2){for(let i=0;i<3;i++){const angle=[-30,0,30][i]*Math.PI/180;const px=cx+Math.cos(angle-Math.PI/2)*26,py=cy+Math.sin(angle-Math.PI/2)*26;deco+=`<circle cx="${px}" cy="${py}" r="1" fill="${r.b3}" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="${1.2+i*0.4}s" repeatCount="indefinite"/></circle>`;}}
  }else if(r.id==='sil'){
    const count=[3,7,12][si];const pts=[[3,8],[41,7],[1,26],[43,25],[5,44],[39,43],[22,-2],[10,16],[34,16],[6,35],[38,35],[22,54],[14,-1]];
    for(let i=0;i<count;i++){const[px,py]=pts[i];deco+=`<circle cx="${px}" cy="${py}" r="${0.8+i%2*0.4}" fill="${r.b3}" opacity="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="${1+i*0.28}s" repeatCount="indefinite"/></circle>`;}
    if(si>=1){deco+=`<ellipse cx="${cx}" cy="${cy}" rx="21" ry="24.5" fill="none" stroke="${r.b3}" stroke-width="0.6" opacity="0.2"><animate attributeName="opacity" values="0.08;0.28;0.08" dur="3s" repeatCount="indefinite"/></ellipse>`;}
    if(si>=2){deco+=`<line x1="${cx}" y1="-6" x2="${cx}" y2="2" stroke="${r.b3}" stroke-width="0.8" stroke-linecap="round" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/></line>`;}
  }else if(r.id==='gold'){

/* ── LEGEND ── */

/* ── DATA ── */
async function loadData(){
  const btn=document.getElementById('rBtn');btn.classList.add('spin');
  document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms" style="font-size:2.5rem;display:block;margin-bottom:1rem;color:var(--acc3)">progress_activity</span>${lang==='jp'?'読み込み中…':'Loading…'}</div>`;
  document.getElementById('pg').innerHTML='';
  try{
    const res=await fetch(GAS);if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const raw=await res.json();
    if(!Array.isArray(raw)||!raw.length)throw new Error(lang==='jp'?'データが空です':'Empty data');
    all=raw.map(r=>({name:String(r.name||''),under100:+r.under100||0,p100:+r.p100||0,p500:+r.p500||0,p750:+r.p750||0,p1000:+r.p1000||0,wrCount:+r.wrCount||0,totalPoints:+r.totalPoints||0}));
    all.sort((a,b)=>b.totalPoints-a.totalPoints||b.wrCount-a.wrCount);
    all.forEach((d,i)=>d.globalRank=i+1);
    document.getElementById('sH').textContent=all.length.toLocaleString();
    document.getElementById('sL').textContent=all.reduce((s,d)=>s+d.wrCount,0).toLocaleString();
    document.getElementById('sT').textContent=new Date().toLocaleTimeString('ja-JP');
    applyFil();toast(lang==='jp'?'読み込み完了':'Loaded');
  }catch(e){
    document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms big" style="color:var(--acc2)">error</span>${lang==='jp'?'データの取得に失敗しました':'Failed to load'}<br><small style="color:#ff5070;font-size:.65rem;margin-top:.5rem;display:block">${e.message}</small></div>`;
    toast(lang==='jp'?'失敗':'Failed');
  }
  btn.classList.remove('spin');
}

function setSort(m){sort=m;pg=1;document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('on'));document.getElementById(m==='pts'?'bPts':'bWr').classList.add('on');applyFil();}
function onSearch(){pg=1;applyFil();}
function applyFil(){
  const q=document.getElementById('si').value.trim().toLowerCase();
  fil=all.filter(d=>d.name.toLowerCase().includes(q));
  if(sort==='pts')fil.sort((a,b)=>b.totalPoints-a.totalPoints||b.wrCount-a.wrCount);
  else fil.sort((a,b)=>b.wrCount-a.wrCount||b.totalPoints-a.totalPoints);
  renderTable();renderPager();
}

/* ── RENDER TABLE ── */
function renderTable(){
  if(!fil.length){document.getElementById('tc').innerHTML=`<div class="smsg"><span class="ms" style="font-size:2.5rem;display:block;margin-bottom:1rem;color:var(--t2)">manage_search</span>${lang==='jp'?'見つかりませんでした':'No players found.'}</div>`;return;}
  const start=(pg-1)*PG;
  const rows=fil.slice(start,start+PG).map((d,li)=>{
    const gr=start+li+1;
    const tc=gr===1?'top1':gr===2?'top2':gr===3?'top3':'topN';
    const rk=getRank(d.totalPoints);const subIdx=getSubTier(rk,d.totalPoints);
    const url=s2u(mkShield(rk,44,subIdx));
    const filledPips=subIdx+1;let pips='';
    for(let i=0;i<3;i++){const filled=i<filledPips;pips+=`<div class="stpip ${filled?'filled':'empty'}" style="background:${filled?rk.col:'var(--t3)'};${filled?`--pc:${rk.col}`:''}"></div>`;}
    const chips=[d.p1000?`<span class="chip c1000">1000+×${d.p1000}</span>`:'',d.p750?`<span class="chip c750">750+×${d.p750}</span>`:'',d.p500?`<span class="chip c500">500+×${d.p500}</span>`:'',d.p100?`<span class="chip c100">100+×${d.p100}</span>`:'',d.under100?`<span class="chip cu100">&lt;100×${d.under100}</span>`:''].join('');
    const rkName=lang==='jp'?rk.jp:rk.en;const subName=rk.subs[subIdx][lang];
    const ptsStyle=gr>3?`color:${rk.col};text-shadow:0 0 10px ${rk.col}55`:gr===1?'color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.55)':gr===2?'color:#c8c8d4':'color:#e8874a';
    return`<tr class="rrow ${tc}" style="animation-delay:${li*.028}s" onclick="openModal(${d.globalRank-1})">
      <td><span class="rnum">${gr}</span></td>
      <td><div class="pcell"><div class="shw" style="--sg:${rk.glow}"><img class="shi" src="${url}" alt="${rkName}"></div>
        <div>
          <a class="pname pname-link" href="community.html?player=${encodeURIComponent(d.name)}" target="_blank" onclick="event.stopPropagation()" title="${lang==='jp'?'WRコース一覧を見る':'View WR courses'}">${esc(d.name)}</a>
          <span class="prank-lbl" style="color:${rk.col};background:${rk.col}18;border:1px solid ${rk.col}28">${rkName} ${subName}</span>
          <div class="subtier">${pips}</div>
        </div></div></td>
      <td class="cc"><div class="cats">${chips||`<span style="color:var(--t3);font-size:.65rem">—</span>`}</div></td>
      <td><div class="wrc">${d.wrCount}</div></td>
      <td><div class="ptv" style="${ptsStyle}">${d.totalPoints}</div></td>

  }).join('');
  const thPl=lang==='jp'?'プレイヤー':'Player';
  const thCa=lang==='jp'?'カテゴリ':'WR Breakdown';
  const thWr=lang==='jp'?'WR数':'WRs';
  const thPt=lang==='jp'?'ポイント':'Points';
  document.getElementById('tc').innerHTML=`<table class="rt"><thead><tr><th class="c" style="width:48px">#</th><th>${thPl}</th><th class="c cc">${thCa}</th><th class="c">${thWr}</th><th class="c">${thPt}</th></tr></thead><tbody>${rows}</tbody></table>`;

/* ── MODAL ── */
function openModal(idx){
  const d=all[idx];if(!d)return;
  const rk=getRank(d.totalPoints);const subIdx=getSubTier(rk,d.totalPoints);
  const rkName=lang==='jp'?rk.jp:rk.en;const subName=rk.subs[subIdx][lang];
  const url=s2u(mkShield(rk,64,subIdx));
  const pos=d.globalRank;const total=all.length;const pct=Math.round((1-(pos-1)/total)*100);
  const sameRank=all.filter(x=>getRank(x.totalPoints).id===rk.id);
  const posInRank=sameRank.findIndex(x=>x.name===d.name)+1;const totalInRank=sameRank.length;
  const nextRank=RANKS[RANKS.indexOf(rk)-1];const prevMin=rk.minPts;const nextMin=nextRank?nextRank.minPts:rk.minPts+50;
  const progressPct=nextRank?Math.min(100,Math.round(((d.totalPoints-prevMin)/(nextMin-prevMin))*100)):100;
  const stCards=rk.subs.map((s,i)=>{const isCurrent=i===subIdx;const hi=i<rk.subs.length-1?rk.subs[i+1].min-1:(nextRank?nextMin-1:999);const range=`${s.min}–${hi}pt`;return`<div class="stier-card${isCurrent?' current':''}" style="--pc:${rk.col}"><div class="stier-card-name" style="color:${isCurrent?rk.col:'var(--t2)'}">${lang==='jp'?rk.jp:rk.en} ${s[lang]}</div><div class="stier-card-range">${range}</div>${isCurrent?`<div class="stier-card-you">▶ ${esc(d.name)}</div>`:''}</div>`;}).join('');
  const chips=[d.p1000?`<span class="chip c1000">1000+: ${d.p1000}個</span>`:'',d.p750?`<span class="chip c750">750+: ${d.p750}個</span>`:'',d.p500?`<span class="chip c500">500+: ${d.p500}個</span>`:'',d.p100?`<span class="chip c100">100+: ${d.p100}個</span>`:'',d.under100?`<span class="chip cu100">&lt;100: ${d.under100}個</span>`:''].join('');
  const t=lang==='jp';
  const seg3=nextRank?(()=>{const rangeTotal=nextMin-prevMin;const b1=rk.subs[1].min;const b2=rk.subs[2].min;const p1=Math.round((b1-prevMin)/rangeTotal*100);const p2=Math.round((b2-prevMin)/rangeTotal*100);return{p1,p2,b1,b2};})():null;
  const tipLeft=Math.min(98,Math.max(2,progressPct));
  const tipHtml=nextRank?`<div class="rp-tip" id="rpTip" style="left:${tipLeft}%;--tipcolor:${rk.col}">${d.totalPoints}pt</div>`:'';
  const divHtml=seg3?`<div class="rp-div" style="left:${seg3.p1}%"></div><div class="rp-div" style="left:${seg3.p2}%"></div>`:'';
  const segLblHtml=seg3?`<div class="rp-seg-labels"><div class="rp-seg-lbl" style="flex:${seg3.p1}">${lang==='jp'?rk.jp+' I':rk.en+' I'}<br>${prevMin}–${seg3.b1-1}pt</div><div class="rp-seg-lbl" style="flex:${seg3.p2-seg3.p1}">${lang==='jp'?rk.jp+' II':rk.en+' II'}<br>${seg3.b1}–${seg3.b2-1}pt</div><div class="rp-seg-lbl" style="flex:${100-seg3.p2}">${lang==='jp'?rk.jp+' III':rk.en+' III'}<br>${seg3.b2}–${nextMin-1}pt</div></div>`:'';
  const calcHtml=`<details class="calc-wrap"><summary class="calc-summary"><span class="ms" style="font-size:1rem;vertical-align:middle;color:var(--acc)">calculate</span>${t?'ポイント計算方法':'How Points Work'}</summary><div class="calc-body"><div class="calc-section-title">${t?'WR カテゴリポイント':'WR Category Points'}</div><div class="calc-table"><div class="ct-row"><span class="ct-tag c1000">1000+</span><span class="ct-desc">${t?'平均フィニッシュタイム 1000秒以上':'avg finish time ≥ 1000s'}</span><span class="ct-pts">+15 pt</span></div><div class="ct-row"><span class="ct-tag c750">750+</span><span class="ct-desc">${t?'平均フィニッシュタイム 750秒以上':'avg finish time ≥ 750s'}</span><span class="ct-pts">+10 pt</span></div><div class="ct-row"><span class="ct-tag c500">500+</span><span class="ct-desc">${t?'平均フィニッシュタイム 500秒以上':'avg finish time ≥ 500s'}</span><span class="ct-pts">+5 pt</span></div><div class="ct-row"><span class="ct-tag c100">100+</span><span class="ct-desc">${t?'平均フィニッシュタイム 100秒以上':'avg finish time ≥ 100s'}</span><span class="ct-pts">+2 pt</span></div><div class="ct-row"><span class="ct-tag cu100">&lt;100</span><span class="ct-desc">${t?'平均フィニッシュタイム 100秒未満':'avg finish time &lt; 100s'}</span><span class="ct-pts">+1 pt</span></div></div><div class="calc-note">${t?'WR を 1 つ取得するごとに、そのコースの平均フィニッシュタイムに応じたポイントが加算されます。':'Each WR grants points based on that level\'s average finish time.'}</div><div class="calc-section-title" style="margin-top:.9rem">${t?'ランク昇格条件':'Rank Thresholds'}</div><div class="calc-table">${RANKS.slice().reverse().map(r=>{const nm=t?r.jp:r.en;const nxt=RANKS[RANKS.indexOf(r)-1];const rng=nxt?`${r.minPts}–${nxt.minPts-1} pt`:`${r.minPts}+ pt`;return`<div class="ct-row"><span class="ct-rank-dot" style="background:${r.col}"></span><span class="ct-desc" style="color:${r.col};font-weight:800">${nm}</span><span class="ct-pts">${rng}</span></div>`;}).join('')}</div></div></details>`;
  document.getElementById('modalContent').innerHTML=`
    <div class="mh"><img class="mh-shield" src="${url}" alt="${rkName}" style="--mg:${rk.glow}"><div><div class="mh-name" style="color:${rk.col}">${esc(d.name)}</div><span class="mh-rank" style="color:${rk.col};background:${rk.col}18;border:1px solid ${rk.col}30">${rkName} ${subName}</span></div></div>
    <div class="rank-pos-wrap"><div class="rp-label">${t?'全体順位':'Overall Ranking'}</div><div class="rp-bar-bg"><div class="rp-bar-track"><div class="rp-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${rk.b1},${rk.b3})"></div></div></div><div class="rp-pct">${t?`全${total}人中 ${pos}位 (上位${100-pct}%)`:`#${pos} of ${total} players (Top ${100-pct}%)`}</div></div>
    <div class="rank-pos-wrap"><div class="rp-label">${t?'次のランクまで':'Progress to Next Rank'}</div><div class="rp-bar-bg"><div class="rp-bar-track"><div class="rp-bar-fill" style="width:${progressPct}%;background:linear-gradient(90deg,${rk.b2},${rk.b3})"></div>${divHtml}</div>${tipHtml}</div>${segLblHtml}<div class="rp-pct">${nextRank?(t?`${d.totalPoints}pt / ${nextMin}pt (あと ${nextMin-d.totalPoints}pt)`:`${d.totalPoints}pt / ${nextMin}pt (${nextMin-d.totalPoints}pt to go)`):(t?'最高ランク到達！':'Max Rank Achieved!')}</div></div>
    <div class="stier-wrap"><div class="stier-title">${t?'ランク内の階級':'Rank Divisions'}</div><div class="stier-grid">${stCards}</div></div>
    <div class="mstats"><div class="mstat"><div class="mstat-lbl">${t?'ポイント':'Points'}</div><div class="mstat-val" style="color:${rk.col}">${d.totalPoints}</div></div><div class="mstat"><div class="mstat-lbl">${t?'WR数':'WR Count'}</div><div class="mstat-val" style="color:var(--acc3)">${d.wrCount}</div></div><div class="mstat"><div class="mstat-lbl">${t?'同ランク内順位':'In-Rank Position'}</div><div class="mstat-val">${posInRank} / ${totalInRank}</div></div><div class="mstat"><div class="mstat-lbl">${t?'全体パーセンタイル':'Percentile'}</div><div class="mstat-val">Top ${100-pct}%</div></div></div>
    ${chips?`<div class="mchips">${chips}</div>`:''}
    ${calcHtml}`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}

/* ── PAGER ── */
function renderPager(){
  const tot=Math.ceil(fil.length/PG);if(tot<=1){document.getElementById('pg').innerHTML='';return;}
  const ns=[];for(let i=1;i<=tot;i++){if(i===1||i===tot||Math.abs(i-pg)<=2)ns.push(i);else if(ns[ns.length-1]!=='…')ns.push('…');}
  let h=`<button class="pgb" onclick="goP(${pg-1})" ${pg===1?'disabled':''}>◀</button>`;
  ns.forEach(n=>{if(n==='…')h+=`<span style="color:var(--t3);padding:0 4px;font-size:.7rem">…</span>`;else h+=`<button class="pgb ${n===pg?'on':''}" onclick="goP(${n})">${n}</button>`;});
  h+=`<button class="pgb" onclick="goP(${pg+1})" ${pg===tot?'disabled':''}>▶</button>`;
  document.getElementById('pg').innerHTML=h;
}
function goP(n){const t=Math.ceil(fil.length/PG);if(n<1||n>t)return;pg=n;renderTable();renderPager();window.scrollTo({top:0,behavior:'smooth'});}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.TM_LANG_HOOK=l=>setLang(l==='ja'?'jp':'en');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect()});

buildLegend();
loadData();
</script>
<script src="https://tanabesan.github.io/lolbeans/tool-menu.js"></script>
</body>
