<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プレイヤー登録申請 | LOLBeans ビーンズランク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,-50..200" />
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;line-height:1;font-size:1.15em;}</style>
<script src="https://tanabesan.github.io/lolbeans/nav-menu.js" defer></script>
<style>
  :root{
    --bg:#05070c;
    --panel:#0d111a;
    --panel2:#11151f;
    --line:#1c2230;
    --accent:#5865F2;
    --text:#e7ecf5;
    --dim:#7a8499;
    --dim2:#4d5567;
    --ok:#7cf29c;
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size:14px;
  }
  .page-hero{
    position:relative;
    min-height:200px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 56px 20px 28px;
    background:
      radial-gradient(circle at 25% 20%, rgba(88,101,242,0.28), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(255,47,176,0.16), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px),
      #05070c;
    border-bottom:1px solid var(--line);
  }
  .page-hero h1{ font-size:22px; margin:0 0 10px; text-shadow: 0 0 18px rgba(88,101,242,0.55); }
  .page-hero p{ color:var(--dim); font-size:12.5px; line-height:1.8; margin:0; max-width:480px; }

  .wrap{
    max-width:420px;
    margin: 32px auto 60px;
    padding: 0 20px;
  }

  .panel{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
  }

  label.field-label{
    display:block;
    font-size:12px;
    color:var(--dim);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    background: var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:7px;
    font-size:13.5px;
    outline:none;
    margin-bottom:16px;
  }
  input[type=text]:focus{ border-color:var(--accent); }

  .icon-picker{
    display:flex; align-items:center; gap:10px;
    background: var(--panel2);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-size:12.5px;
    color:var(--dim);
    margin-bottom:18px;
  }
  .icon-picker:hover{ border-color:var(--accent); color:var(--text); }
  .icon-picker img{ width:40px; height:40px; border-radius:50%; object-fit:cover; display:none; }

  button.submit{
    width:100%;
    padding:12px;
    background: var(--accent);
    border:none;
    border-radius:8px;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  button.submit:disabled{ background:#262c3d; color:var(--dim2); cursor:not-allowed; }

  .status{ margin-top:12px; font-size:12.5px; text-align:center; min-height:16px; }
  .status.ok{ color:var(--ok); }
  .status.err{ color:var(--danger); }
  .status.info{ color:var(--dim); }

  .hint{ font-size:11px; color:var(--dim2); line-height:1.6; margin-top:14px; }

  @media (max-width:480px){
    .wrap{ padding:0 14px; }
    .panel{ padding:18px; }
    .page-hero{ min-height:180px; padding:52px 16px 24px; }
    .page-hero h1{ font-size:19px; }
  }
</style>
</head>
<body data-nav-current="lolrank-submit">

<div class="page-hero">
  <h1><span class="material-symbols-outlined">person_add</span> プレイヤー登録申請</h1>
  <p>ビーンズランクにまだ登録されていない人を、評価対象として追加リクエストできます。<br>承認され次第、投票フォームの一覧に表示されます。</p>
</div>

<div class="wrap">
  <div class="panel">
    <label class="field-label">登録したい人の名前</label>
    <input type="text" id="nameInput" placeholder="例: ぬーん">

    <label class="field-label">アイコン画像(任意)</label>
    <label class="icon-picker" for="iconInput">
      <img id="iconPreview" alt="">
      <span id="iconPlaceholder">＋ 画像を選択(未設定でも申請可)</span>
    </label>
    <input type="file" id="iconInput" accept="image/*" style="display:none;">

    <button class="submit" id="submitBtn">申請を送信する</button>
    <div class="status info" id="statusMsg"></div>

    <div class="hint">
      ※申請はすぐには反映されません。管理者が確認・承認した後、ランキングの評価対象として使えるようになります。<br>
      ※アイコンは2MBまで。
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJqqCzt_xppIt0lg3ItQfPwoR9uLWRWZI",
  authDomain: "lolex0204.firebaseapp.com",
  projectId: "lolex0204",
  storageBucket: "lolex0204.firebasestorage.app",
  messagingSenderId: "940620254622",
  appId: "1:940620254622:web:edca80d191423cd460da8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const MAX_ICON_BYTES = 2 * 1024 * 1024;

const nameInput = document.getElementById("nameInput");
const iconInput = document.getElementById("iconInput");
const iconPreview = document.getElementById("iconPreview");
const iconPlaceholder = document.getElementById("iconPlaceholder");
const submitBtn = document.getElementById("submitBtn");
const statusMsg = document.getElementById("statusMsg");

iconInput.addEventListener("change", () => {
  const file = iconInput.files[0];
  if (!file) return;
  iconPreview.src = URL.createObjectURL(file);
  iconPreview.style.display = "block";
  iconPlaceholder.style.display = "none";
});

submitBtn.addEventListener("click", async () => {
  const name = nameInput.value.trim();
  const iconFile = iconInput.files[0] || null;

  if (!name){
    statusMsg.textContent = "名前を入力してください";
    statusMsg.className = "status err";
    return;
  }
  if (iconFile && iconFile.size > MAX_ICON_BYTES){
    statusMsg.textContent = "アイコンのファイルサイズは2MB以内にしてください";
    statusMsg.className = "status err";
    return;
  }

  submitBtn.disabled = true;
  statusMsg.textContent = iconFile ? "送信中(アイコンをアップロード中)..." : "送信中...";
  statusMsg.className = "status info";

  try {
    let iconUrl = null;
    if (iconFile){
      // 既存のpending/配下ルール(未認証でも書き込み可・5MB未満)を利用
      const ext = (iconFile.name.split(".").pop() || "png").toLowerCase();
      const path = `pending/player-icon-requests/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, iconFile);
      iconUrl = await getDownloadURL(fileRef);
    }

    await addDoc(collection(db, "playerRequests"), {
      name,
      iconUrl,
      status: "pending",
      createdAt: serverTimestamp(),
    });

    nameInput.value = "";
    iconInput.value = "";
    iconPreview.style.display = "none";
    iconPlaceholder.style.display = "inline";
    statusMsg.textContent = "申請を送信しました。承認をお待ちください";
    statusMsg.className = "status ok";
  } catch(e){
    console.error(e);
    statusMsg.textContent = "送信に失敗しました。時間をおいて再度お試しください";
    statusMsg.className = "status err";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
