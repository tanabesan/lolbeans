<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME OF LIFE // CRAFT EDITION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f0b;
    --panel: #101711;
    --panel-2: #0d130e;
    --border: #24361f;
    --border-strong: #3a5a2f;
    --text: #d9ecd1;
    --text-dim: #7f9a76;
    --green: #3ddc84;
    --green-dim: #1d8054;
    --amber: #f2b544;
    --cyan: #59d0e8;
    --danger: #e0645c;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }
  body{
    position: relative;
    padding: 32px 16px 60px;
    display:flex; justify-content:center;
  }
  body::before{
    content:"";
    position: fixed; inset:0;
    background: repeating-linear-gradient(
      0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events:none;
    z-index: 50;
  }
  .wrap{ width: 100%; max-width: 920px; }

  header{ margin-bottom: 24px; text-align:center; }
  h1{
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--green);
    margin: 0 0 10px;
    text-shadow: 0 0 6px rgba(61,220,132,0.35);
  }
  header p{
    color: var(--text-dim);
    font-size: 13px;
    margin: 0;
    letter-spacing: 0.5px;
  }

  .panel{
    background: var(--panel);
    border: 2px solid var(--border);
    box-shadow: 0 0 0 4px var(--panel-2), 0 0 24px rgba(0,0,0,0.5);
    padding: 16px;
    margin-bottom: 16px;
  }

  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    margin-bottom: 14px;
  }
  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    background: var(--panel-2);
    color: var(--text);
    border: 2px solid var(--border-strong);
    padding: 8px 12px;
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
    transition: transform 0.05s ease, border-color 0.15s ease;
  }
  button:hover{ border-color: var(--green); color: var(--green); }
  button:active{ transform: scale(0.96); }
  button:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }
  button.primary{ border-color: var(--green); color: var(--green); }
  button.danger:hover{ border-color: var(--danger); color: var(--danger); }

  .stats{
    margin-left: auto;
    display:flex; gap: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stats b{ color: var(--amber); font-weight:600; }

  .speed-row{ display:flex; align-items:center; gap:10px; font-size:12px; color: var(--text-dim); }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width: 120px; height: 4px;
    background: var(--border-strong);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    background: var(--green);
    border: 2px solid var(--panel-2);
    cursor:pointer;
  }

  canvas{
    display:block;
    width: 100%;
    aspect-ratio: 70/44;
    background: #060a06;
    image-rendering: pixelated;
    cursor: crosshair;
  }

  .craft-label{
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 1px;
    margin: 0 0 10px;
  }
  .hotbar{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
  }
  .slot{
    background: var(--panel-2);
    border: 2px solid var(--border-strong);
    padding: 8px 6px 6px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
  }
  .slot:hover{ border-color: var(--cyan); }
  .slot.selected{ border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
  .slot canvas{ width: 48px; height: 48px; aspect-ratio: unset; background: #060a06; }
  .slot span{ font-size: 10px; color: var(--text-dim); text-align:center; line-height:1.3; }
  .slot.selected span{ color: var(--green); }

  footer{ text-align:center; color: var(--text-dim); font-size: 11px; margin-top: 8px; }
  footer kbd{
    background: var(--panel-2); border: 1px solid var(--border-strong);
    padding: 1px 5px; color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GAME OF LIFE</h1>
    <p>盤面をクリックしてセルを配置 / 下のクラフトパレットからパターンを選択して設置</p>
  </header>

  <div class="panel">
    <div class="toolbar">
      <button id="playBtn" class="primary"><span id="playIcon">▶</span><span id="playLabel">再生</span></button>
      <button id="stepBtn">⏭ 1世代</button>
      <button id="randomBtn">⟲ ランダム</button>
      <button id="clearBtn" class="danger">✕ クリア</button>
      <div class="speed-row">
        <span>速度</span>
        <input type="range" id="speed" min="1" max="20" value="9" step="1">
      </div>
      <div class="stats">
        <span>世代 <b id="genCount">0</b></span>
        <span>生存 <b id="aliveCount">0</b></span>
      </div>
    </div>
    <canvas id="board"></canvas>
  </div>

  <div class="panel">
    <p class="craft-label">// CRAFT PALETTE — 設置するパターンを選択</p>
    <div class="hotbar" id="hotbar"></div>
  </div>

  <footer>盤面はループ（トーラス）構造 / <kbd>クリック</kbd> で設置・単セル切替 / パターン選択中はカーソル位置にプレビューが表示されます</footer>
</div>

<script>
(function(){
  const COLS = 70, ROWS = 44;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  let cell = 10;
  let grid = new Uint8Array(COLS * ROWS);
  const idx = (x,y) => y*COLS + x;

  function parseAscii(rows){
    const cells = [];
    rows.forEach((row, y) => {
      for(let x=0; x<row.length; x++){
        if(row[x] === 'O' || row[x] === 'X') cells.push([x,y]);
      }
    });
    return cells;
  }

  const PATTERNS = {
    cell: { name:'単セル', cells:[[0,0]], w:1, h:1 },
    block: { name:'ブロック', cells:[[0,0],[1,0],[0,1],[1,1]], w:2, h:2 },
    blinker: { name:'ブリンカー', cells:[[0,0],[1,0],[2,0]], w:3, h:1 },
    glider: { name:'グライダー', cells:[[1,0],[2,1],[0,2],[1,2],[2,2]], w:3, h:3 },
    lwss: {
      name:'軽量宇宙船',
      cells: parseAscii([
        '.OOOO',
        'O...O',
        '....O',
        'O..O.'
      ]),
      w:5, h:4
    },
    pulsar: {
      name:'パルサー',
      cells: parseAscii([
        '..OOO...OOO..',
        '.............',
        'O....O.O....O',
        'O....O.O....O',
        'O....O.O....O',
        '..OOO...OOO..',
        '.............',
        '..OOO...OOO..',
        'O....O.O....O',
        'O....O.O....O',
        'O....O.O....O',
        '.............',
        '..OOO...OOO..'
      ]),
      w:13, h:13
    },
    gun: {
      name:'グライダー銃',
      cells: [
        [24,0],
        [22,1],[24,1],
        [12,2],[13,2],[20,2],[21,2],[34,2],[35,2],
        [11,3],[15,3],[20,3],[21,3],[34,3],[35,3],
        [0,4],[1,4],[10,4],[16,4],[20,4],[21,4],
        [0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],
        [10,6],[16,6],[24,6],
        [11,7],[15,7],
        [12,8],[13,8]
      ],
      w:36, h:9
    }
  };

  let currentTool = 'cell';
  let gen = 0;
  let playing = false;
  let timer = null;
  let hoverCell = null;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    cell = canvas.width / COLS;
    draw();
  }

  function randomize(){
    for(let i=0;i<grid.length;i++) grid[i] = Math.random() < 0.28 ? 1 : 0;
    gen = 0; updateStats(); draw();
  }
  function clearGrid(){
    grid.fill(0); gen = 0; updateStats(); draw();
  }

  function neighbors(x,y){
    let n = 0;
    for(let dy=-1; dy<=1; dy++){
      for(let dx=-1; dx<=1; dx++){
        if(dx===0 && dy===0) continue;
        const nx = (x+dx+COLS)%COLS;
        const ny = (y+dy+ROWS)%ROWS;
        n += grid[idx(nx,ny)];
      }
    }
    return n;
  }

  function step(){
    const next = new Uint8Array(COLS*ROWS);
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const alive = grid[idx(x,y)];
        const n = neighbors(x,y);
        next[idx(x,y)] = alive ? (n===2||n===3 ? 1:0) : (n===3 ? 1:0);
      }
    }
    grid = next; gen++; updateStats(); draw();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#3ddc84';
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(grid[idx(x,y)]) ctx.fillRect(x*cell, y*cell, cell-1, cell-1);
      }
    }
    if(hoverCell){
      const pat = PATTERNS[currentTool];
      const ox = hoverCell.x - Math.floor(pat.w/2);
      const oy = hoverCell.y - Math.floor(pat.h/2);
      ctx.fillStyle = 'rgba(242,181,68,0.55)';
      pat.cells.forEach(([dx,dy]) => {
        const x = (ox+dx+COLS)%COLS, y = (oy+dy+ROWS)%ROWS;
        ctx.fillRect(x*cell, y*cell, cell-1, cell-1);
      });
    }
  }

  function updateStats(){
    document.getElementById('genCount').textContent = gen;
    let count = 0;
    for(let i=0;i<grid.length;i++) count += grid[i];
    document.getElementById('aliveCount').textContent = count;
  }

  function canvasCellAt(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((clientX - rect.left) / rect.width * COLS);
    const y = Math.floor((clientY - rect.top) / rect.height * ROWS);
    return {x,y};
  }

  function stampPattern(cx, cy){
    const pat = PATTERNS[currentTool];
    const ox = cx - Math.floor(pat.w/2);
    const oy = cy - Math.floor(pat.h/2);
    if(currentTool === 'cell'){
      const i = idx((cx+COLS)%COLS, (cy+ROWS)%ROWS);
      grid[i] = grid[i] ? 0 : 1;
    } else {
      pat.cells.forEach(([dx,dy]) => {
        const x = (ox+dx+COLS)%COLS, y = (oy+dy+ROWS)%ROWS;
        grid[idx(x,y)] = 1;
      });
    }
    updateStats(); draw();
  }

  canvas.addEventListener('click', (e) => {
    const {x,y} = canvasCellAt(e.clientX, e.clientY);
    if(x>=0 && x<COLS && y>=0 && y<ROWS) stampPattern(x,y);
  });
  canvas.addEventListener('mousemove', (e) => {
    const {x,y} = canvasCellAt(e.clientX, e.clientY);
    if(x>=0 && x<COLS && y>=0 && y<ROWS){ hoverCell = {x,y}; draw(); }
  });
  canvas.addEventListener('mouseleave', () => { hoverCell = null; draw(); });

  document.getElementById('playBtn').addEventListener('click', function(){
    playing = !playing;
    document.getElementById('playLabel').textContent = playing ? '一時停止' : '再生';
    document.getElementById('playIcon').textContent = playing ? '❚❚' : '▶';
    if(playing) runLoop(); else if(timer) clearTimeout(timer);
  });
  function runLoop(){
    if(!playing) return;
    step();
    const speed = document.getElementById('speed').value;
    timer = setTimeout(runLoop, 550 - speed*25);
  }
  document.getElementById('stepBtn').addEventListener('click', step);
  document.getElementById('randomBtn').addEventListener('click', randomize);
  document.getElementById('clearBtn').addEventListener('click', clearGrid);

  function buildHotbar(){
    const hotbar = document.getElementById('hotbar');
    Object.keys(PATTERNS).forEach(key => {
      const pat = PATTERNS[key];
      const slot = document.createElement('div');
      slot.className = 'slot' + (key === currentTool ? ' selected' : '');
      slot.dataset.key = key;

      const mini = document.createElement('canvas');
      mini.width = 48; mini.height = 48;
      const mctx = mini.getContext('2d');
      const scale = 48 / Math.max(pat.w, pat.h);
      mctx.fillStyle = '#3ddc84';
      const offX = (48 - pat.w*scale)/2, offY = (48 - pat.h*scale)/2;
      pat.cells.forEach(([dx,dy]) => {
        mctx.fillRect(offX + dx*scale, offY + dy*scale, Math.max(scale-1,1), Math.max(scale-1,1));
      });

      const label = document.createElement('span');
      label.textContent = pat.name;

      slot.appendChild(mini);
      slot.appendChild(label);
      slot.addEventListener('click', () => {
        currentTool = key;
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
      });
      hotbar.appendChild(slot);
    });
  }

  buildHotbar();
  window.addEventListener('resize', resize);
  resize();
  randomize();
})();
</script>
</body>
</html>
